<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 成果 Dashboard</title>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <style>
        /* ============ 柔和雙主題色彩系統 ============ */
        :root, body[data-theme="dark"] {
            --bg: #16181d;              /* 柔和深灰藍背景 */
            --card: #21242c;            /* 卡片 */
            --panel: #1b1e25;           /* 內層面板 */
            --border: #343945;
            --input: #2a2e38;
            --text-1: #e8eaee;          /* 主文字 */
            --text-2: #b4bac4;          /* 次文字 */
            --text-3: #848b97;          /* 弱文字 */
            --accent: #6fc296;          /* 柔和薄荷綠 */
            --accent-strong: #5bb384;
            --accent-text: #10231a;
            --accent-soft: rgba(111, 194, 150, .13);
            --danger: #e08f8f;
            --danger-soft: rgba(224, 143, 143, .12);
            --danger-border: rgba(224, 143, 143, .38);
            --link: #8fb4e3;
            --shadow: 0 4px 18px rgba(0, 0, 0, .32);
        }
        body[data-theme="light"] {
            --bg: #f6f5f1;              /* 米白紙感背景 */
            --card: #ffffff;
            --panel: #faf9f5;
            --border: #e4e1d8;
            --input: #f2f0ea;
            --text-1: #3b3f46;
            --text-2: #61666e;
            --text-3: #9aa0a8;
            --accent: #4da57c;          /* 柔和鼠尾草綠 */
            --accent-strong: #418f6b;
            --accent-text: #ffffff;
            --accent-soft: rgba(77, 165, 124, .11);
            --danger: #c76e6e;
            --danger-soft: rgba(199, 110, 110, .10);
            --danger-border: rgba(199, 110, 110, .35);
            --link: #5b83ba;
            --shadow: 0 4px 14px rgba(70, 68, 58, .08);
        }

        body {
            background: var(--bg);
            color: var(--text-1);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            transition: background-color .25s ease, color .25s ease;
        }

        .app-card  { background: var(--card);  border: 1px solid var(--border); box-shadow: var(--shadow); }
        .app-panel { background: var(--panel); border: 1px solid var(--border); }
        .app-input { background: var(--input); border: 1px solid var(--border); color: var(--text-1); }
        .app-input::placeholder { color: var(--text-3); }
        .app-input:focus { border-color: var(--accent); outline: none; }
        .app-input:disabled { opacity: .5; }
        .app-file::file-selector-button {
            background: var(--accent); color: var(--accent-text);
            border: none; border-radius: 6px; padding: 4px 12px; margin-right: 12px;
            font-weight: 700; cursor: pointer;
        }

        .t1 { color: var(--text-1); } .t2 { color: var(--text-2); } .t3 { color: var(--text-3); }
        .accent { color: var(--accent); }
        .danger { color: var(--danger); }
        .link { color: var(--link); }
        .bd { border-color: var(--border) !important; }

        .btn-accent { background: var(--accent); color: var(--accent-text); transition: background .15s; }
        .btn-accent:hover:not(:disabled) { background: var(--accent-strong); }
        .btn-ghost { background: var(--input); color: var(--text-2); border: 1px solid var(--border); transition: filter .15s; }
        .btn-ghost:hover { filter: brightness(1.08); }
        .btn-danger { background: var(--danger-soft); color: var(--danger); border: 1px solid var(--danger-border); transition: filter .15s; }
        .btn-danger:hover { filter: brightness(1.12); }
        .btn-accent-soft { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent); }

        .logo { background: var(--accent); color: var(--accent-text); }
        .navpill { color: var(--text-2); }
        .navpill:hover { background: var(--input); }
        .navpill-active { background: var(--accent); color: var(--accent-text); font-weight: 700; }

        /* 狀態標籤（柔和版，雙主題） */
        body[data-theme="dark"] .tag-status-規劃 { background: #2a2e38; color: #9aa1ac; border: 1px solid #3b4150; }
        body[data-theme="dark"] .tag-status-開發 { background: rgba(120, 160, 220, .14); color: #93b3e0; border: 1px solid rgba(120, 160, 220, .38); }
        body[data-theme="dark"] .tag-status-測試 { background: rgba(220, 185, 115, .14); color: #dfc18a; border: 1px solid rgba(220, 185, 115, .38); }
        body[data-theme="dark"] .tag-status-上線 { background: rgba(111, 194, 150, .14); color: #85cba5; border: 1px solid rgba(111, 194, 150, .38); }
        body[data-theme="dark"] .tag-status-下線 { background: rgba(224, 143, 143, .13); color: #e2a0a0; border: 1px solid rgba(224, 143, 143, .36); }
        body[data-theme="light"] .tag-status-規劃 { background: #edebe4; color: #7c828b; border: 1px solid #dcd8cd; }
        body[data-theme="light"] .tag-status-開發 { background: #e9f0f9; color: #5077b3; border: 1px solid #ccdcf0; }
        body[data-theme="light"] .tag-status-測試 { background: #f8f0dd; color: #9d8040; border: 1px solid #eadcb4; }
        body[data-theme="light"] .tag-status-上線 { background: #e6f2eb; color: #3f8b64; border: 1px solid #c6e1d1; }
        body[data-theme="light"] .tag-status-下線 { background: #f6e8e8; color: #ad6161; border: 1px solid #eacccc; }

        /* 區塊標題色（柔和版） */
        body[data-theme="dark"] .sec-pain     { color: #dd9797; } body[data-theme="light"] .sec-pain     { color: #b56a6a; }
        body[data-theme="dark"] .sec-target   { color: #93b3e0; } body[data-theme="light"] .sec-target   { color: #5077b3; }
        .sec-solution { color: var(--accent); }
        body[data-theme="dark"] .sec-progress { color: #dfc18a; } body[data-theme="light"] .sec-progress { color: #9d8040; }
        body[data-theme="dark"] .bar-pain     { background: #c98383; } body[data-theme="light"] .bar-pain     { background: #cf9494; }
        body[data-theme="dark"] .bar-target   { background: #7fa2d4; } body[data-theme="light"] .bar-target   { background: #93b0d8; }
        .bar-solution { background: var(--accent); }
        body[data-theme="dark"] .bar-progress { background: #cfae76; } body[data-theme="light"] .bar-progress { background: #d5bb8b; }
    </style>
</head>
<body data-theme="dark">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // ⚠️ 請填入你的 Supabase 連線資訊 ⚠️
        const SUPABASE_URL = "https://pbdgrwokkulcjsyoknhu.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBiZGdyd29ra3VsY2pzeW9rbmh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MzA2NDIsImV4cCI6MjEwMjMwNjY0Mn0.uDEfM8o5B81IjjG9dw1bUqNA7BRdlriPXhJe7EZYZOQ";

        const isConfigured = SUPABASE_URL && !SUPABASE_URL.includes("your-project-id");
        const supabase = isConfigured && window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        // 帳號格式：需同時包含英文字母與數字
        const ACCOUNT_REGEX = /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z0-9]+$/;
        // 密碼格式：固定 6 碼數字
        const PASSWORD_REGEX = /^\d{6}$/;

        // 登入狀態儲存 Key（localStorage 依「網域」各自獨立保存）
        const SESSION_KEY = "ai_dashboard_session";
        const THEME_KEY = "ai_dashboard_theme";
        // 閒置多久自動登出：4 小時
        const INACTIVITY_LIMIT_MS = 4 * 60 * 60 * 1000;

        const STATUS_LIST = ["規劃", "開發", "測試", "上線", "下線"];
        const MAX_IMAGES = 3;
        const MAX_FILES = 3;          // 相關文件最多 3 個
        const MAX_FILE_MB = 20;       // 單一文件上限
        const MAX_VIDEO_MB = 50;      // 教學影片上限
        const STORAGE_BUCKET = "project-files";

        // 單位選項（含三班）
        const UNIT_OPTIONS = ["JJ-早", "JJ-中", "JJ-晚"];
        const getShift = (u) => {
            if (u.unit && u.unit.includes('-')) return u.unit.split('-')[1];
            return u.shift || '';
        };
        const getBaseUnit = (u) => {
            if (!u.unit) return 'JJ';
            return u.unit.split('-')[0];
        };

        // 解析 image_url：支援舊格式（單一字串）與新格式（JSON 陣列字串）
        const parseImages = (val) => {
            if (!val) return [];
            if (typeof val === 'string' && val.trim().startsWith('[')) {
                try {
                    const arr = JSON.parse(val);
                    return Array.isArray(arr) ? arr.filter(Boolean) : [];
                } catch (e) { return [val]; }
            }
            return [val];
        };

        // 解析 files 欄位：JSON 陣列 [{name, url}]
        const parseFiles = (val) => {
            if (!val) return [];
            try {
                const arr = JSON.parse(val);
                return Array.isArray(arr) ? arr.filter(x => x && x.url) : [];
            } catch (e) { return []; }
        };

        // ===== Session 讀寫（含最後活動時間，供閒置登出判斷）=====
        const readSession = () => {
            try {
                const raw = JSON.parse(localStorage.getItem(SESSION_KEY));
                if (!raw) return null;
                // 相容舊格式（直接存 user 物件）
                if (raw.account && !raw.user) return { user: raw, lastActive: Date.now() };
                if (raw.user && raw.user.account) return raw;
                return null;
            } catch (e) { return null; }
        };
        const writeSession = (user) => {
            try { localStorage.setItem(SESSION_KEY, JSON.stringify({ user, lastActive: Date.now() })); } catch (e) {}
        };
        const clearSession = () => {
            try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
        };

        function App() {
            const [currentTab, setCurrentTab] = useState("專案列表");
            const [projects, setProjects] = useState([]);

            // 深淺色主題
            const [theme, setTheme] = useState(() => {
                try { return localStorage.getItem(THEME_KEY) || 'dark'; } catch (e) { return 'dark'; }
            });
            useEffect(() => {
                document.body.setAttribute('data-theme', theme);
                try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
            }, [theme]);

            // 本地模擬模式下的預設帳號
            const [users, setUsers] = useState([
                { id: "1", name: "Admin", account: "admin01", password: "123456", role: "ADMIN", unit: "JJ-早", shift: "早", status: "active" },
                { id: "2", name: "成員 A", account: "usera01", password: "111111", role: "MEMBER", unit: "JJ-中", shift: "中", status: "active" }
            ]);

            // ===== 登入狀態 =====
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [currentUser, setCurrentUser] = useState(null);
            const [loginForm, setLoginForm] = useState({ account: "", password: "" });
            const [loginError, setLoginError] = useState("");
            const [sessionNotice, setSessionNotice] = useState("");
            const [loggingIn, setLoggingIn] = useState(false);
            const [restoring, setRestoring] = useState(true);

            // Modal 控制
            const [showProjectModal, setShowProjectModal] = useState(false);
            const [showUserModal, setShowUserModal] = useState(false);
            const [submitting, setSubmitting] = useState(false);

            const [editingProjectId, setEditingProjectId] = useState(null);
            const [viewingProjectId, setViewingProjectId] = useState(null);
            const [lightboxUrl, setLightboxUrl] = useState(null);

            // 上傳中狀態
            const [uploadingFiles, setUploadingFiles] = useState(false);
            const [uploadingVideo, setUploadingVideo] = useState(false);

            // ===== 編輯成員帳號 Modal =====
            const [editUserTarget, setEditUserTarget] = useState(null);
            const [editUserForm, setEditUserForm] = useState({ name: "", role: "MEMBER", unit: "JJ-早", password: "" });
            const [editUserSaving, setEditUserSaving] = useState(false);

            // ===== 留言與更新紀錄 =====
            const [comments, setComments] = useState([]);
            const [newComment, setNewComment] = useState("");
            const [postingComment, setPostingComment] = useState(false);

            // ===== 搜尋 / 篩選 =====
            const [searchText, setSearchText] = useState("");
            const [filterStatus, setFilterStatus] = useState("全部");
            const [filterAuthor, setFilterAuthor] = useState("全部");
            const [filterType, setFilterType] = useState("全部");

            // 發布 / 編輯專案 Form
            const [newProject, setNewProject] = useState({
                title: "", type: "小工具", dept: "JJ", author: "", status: "規劃",
                link: "", images: [], files: [], video: "",
                pain_point: "", target: "", solution: "", progress: ""
            });

            // 新增成員 Form
            const [newUser, setNewUser] = useState({
                name: "", account: "", password: "", email: "", role: "ADMIN", unit: "JJ-早", shift: "早"
            });

            // ===== 閒置自動登出 =====
            const lastTouchRef = useRef(Date.now());
            const lastWriteRef = useRef(0);

            const forceLogout = (notice) => {
                setIsLoggedIn(false);
                setCurrentUser(null);
                setLoginForm({ account: "", password: "" });
                setLoginError("");
                setCurrentTab("專案列表");
                setViewingProjectId(null);
                clearSession();
                if (notice) setSessionNotice(notice);
            };

            useEffect(() => {
                if (!isLoggedIn) return;
                lastTouchRef.current = Date.now();

                const touch = () => {
                    const now = Date.now();
                    lastTouchRef.current = now;
                    // 節流：最多每 60 秒寫入一次 localStorage
                    if (now - lastWriteRef.current > 60 * 1000) {
                        lastWriteRef.current = now;
                        try {
                            const s = readSession();
                            if (s) {
                                s.lastActive = now;
                                localStorage.setItem(SESSION_KEY, JSON.stringify(s));
                            }
                        } catch (e) {}
                    }
                };
                const check = () => {
                    let last = lastTouchRef.current;
                    const s = readSession();
                    if (s && s.lastActive) last = Math.max(last, s.lastActive);
                    if (Date.now() - last > INACTIVITY_LIMIT_MS) {
                        forceLogout("閒置超過 4 小時，為了安全已自動登出，請重新登入");
                    }
                };
                const events = ['click', 'keydown', 'scroll', 'touchstart'];
                events.forEach(ev => window.addEventListener(ev, touch, { passive: true }));
                const timer = setInterval(check, 60 * 1000);
                return () => {
                    events.forEach(ev => window.removeEventListener(ev, touch));
                    clearInterval(timer);
                };
            }, [isLoggedIn]);

            // ===== 初始化：還原登入狀態 + 讀取資料 =====
            useEffect(() => {
                const init = async () => {
                    try {
                        const saved = readSession();
                        if (saved && saved.user && saved.user.account) {
                            // 閒置超過 4 小時 → 不還原，要求重新登入
                            if (saved.lastActive && Date.now() - saved.lastActive > INACTIVITY_LIMIT_MS) {
                                clearSession();
                                setSessionNotice("閒置超過 4 小時，為了安全已自動登出，請重新登入");
                            } else if (supabase) {
                                const { data } = await supabase
                                    .from('profiles')
                                    .select('*')
                                    .eq('account', saved.user.account)
                                    .maybeSingle();
                                if (data && data.status !== 'disabled') {
                                    const userObj = { id: data.id, name: data.name, role: data.role, account: data.account };
                                    setCurrentUser(userObj);
                                    setIsLoggedIn(true);
                                    writeSession(userObj);
                                } else {
                                    clearSession();
                                }
                            } else {
                                setCurrentUser(saved.user);
                                setIsLoggedIn(true);
                                writeSession(saved.user);
                            }
                        }
                    } catch (e) {
                        console.error("還原登入狀態失敗：", e);
                    } finally {
                        setRestoring(false);
                    }
                    fetchData();
                };
                init();
            }, []);

            // ESC 關閉燈箱
            useEffect(() => {
                const onKey = (e) => { if (e.key === "Escape") setLightboxUrl(null); };
                window.addEventListener("keydown", onKey);
                return () => window.removeEventListener("keydown", onKey);
            }, []);

            const fetchData = async () => {
                if (supabase) {
                    try {
                        const { data: projData } = await supabase.from('projects').select('*').order('id', { ascending: false });
                        const { data: userData } = await supabase.from('profiles').select('*');
                        if (projData) setProjects(projData);
                        if (userData && userData.length > 0) setUsers(userData);
                        const { data: commentData } = await supabase.from('comments').select('*').order('id', { ascending: true });
                        if (commentData) setComments(commentData);
                    } catch (err) {
                        console.error("讀取失敗：", err);
                    }
                }
            };

            // ===== 登入 =====
            const handleLogin = async (e) => {
                e.preventDefault();
                setLoginError("");
                setSessionNotice("");
                const account = loginForm.account.trim();
                const password = loginForm.password.trim();
                if (!account || !password) {
                    setLoginError("請輸入帳號與密碼");
                    return;
                }

                setLoggingIn(true);
                try {
                    let userObj = null;
                    if (supabase) {
                        const { data, error } = await supabase
                            .from('profiles')
                            .select('*')
                            .eq('account', account)
                            .eq('password', password)
                            .maybeSingle();

                        if (error || !data) {
                            setLoginError("帳號或密碼錯誤");
                        } else if (data.status === 'disabled') {
                            setLoginError("此帳號已被停用，請聯絡管理員");
                        } else {
                            userObj = { id: data.id, name: data.name, role: data.role, account: data.account };
                        }
                    } else {
                        const matched = users.find(u => u.account === account && u.password === password);
                        if (!matched) {
                            setLoginError("帳號或密碼錯誤（本地模擬模式）");
                        } else if (matched.status === 'disabled') {
                            setLoginError("此帳號已被停用，請聯絡管理員");
                        } else {
                            userObj = { id: matched.id, name: matched.name, role: matched.role, account: matched.account };
                        }
                    }

                    if (userObj) {
                        setCurrentUser(userObj);
                        setIsLoggedIn(true);
                        writeSession(userObj);
                    }
                } catch (err) {
                    setLoginError("登入時發生錯誤，請稍後再試");
                } finally {
                    setLoggingIn(false);
                }
            };

            const handleLogout = () => {
                if (confirm("確定要登出系統嗎？")) forceLogout("");
            };

            // 專案編輯／刪除權限：僅發布者「本人」可操作（管理員也不能改別人的專案）
            const canManageProject = (item) => {
                if (!currentUser) return false;
                return item.author === currentUser.name;
            };

            // ⚡ 圖片自動等比例壓縮 (最高 800px，品質 70%)
            const compressImage = (file) => new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onerror = () => reject(new Error("讀取圖片失敗"));
                reader.onload = (event) => {
                    const img = new Image();
                    img.onerror = () => reject(new Error("圖片格式不支援"));
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const maxDim = 800;
                        if (width > maxDim || height > maxDim) {
                            if (width > height) {
                                height = Math.round((height * maxDim) / width);
                                width = maxDim;
                            } else {
                                width = Math.round((width * maxDim) / height);
                                height = maxDim;
                            }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });

            // 上傳 1~3 張圖片
            const handleImageUpload = async (e) => {
                const files = Array.from(e.target.files || []);
                e.target.value = "";
                if (!files.length) return;

                const remaining = MAX_IMAGES - newProject.images.length;
                if (remaining <= 0) {
                    alert(`最多只能上傳 ${MAX_IMAGES} 張圖片，請先刪除不要的圖片`);
                    return;
                }
                if (files.length > remaining) alert(`最多 ${MAX_IMAGES} 張，將只加入前 ${remaining} 張`);

                try {
                    const toProcess = files.slice(0, remaining);
                    const results = [];
                    for (const f of toProcess) results.push(await compressImage(f));
                    setNewProject(prev => ({ ...prev, images: [...prev.images, ...results].slice(0, MAX_IMAGES) }));
                } catch (err) {
                    alert("圖片處理失敗：" + err.message);
                }
            };
            const handleRemoveImage = (idx) => {
                setNewProject(prev => ({ ...prev, images: prev.images.filter((_, i) => i !== idx) }));
            };

            // 上傳檔案到 Supabase Storage，回傳公開網址
            const uploadToStorage = async (file, folder) => {
                const ext = (file.name.split('.').pop() || 'bin').toLowerCase();
                const path = `${folder}/${Date.now()}_${Math.random().toString(36).slice(2, 8)}.${ext}`;
                const { error } = await supabase.storage.from(STORAGE_BUCKET).upload(path, file);
                if (error) throw error;
                const { data } = supabase.storage.from(STORAGE_BUCKET).getPublicUrl(path);
                return data.publicUrl;
            };

            // 📎 上傳相關文件（txt/pdf/office 等，最多 3 個）
            const handleDocUpload = async (e) => {
                const files = Array.from(e.target.files || []);
                e.target.value = "";
                if (!files.length) return;

                const remaining = MAX_FILES - newProject.files.length;
                if (remaining <= 0) {
                    alert(`最多只能上傳 ${MAX_FILES} 個文件，請先刪除不要的`);
                    return;
                }
                const toProcess = files.slice(0, remaining);
                if (files.length > remaining) alert(`最多 ${MAX_FILES} 個文件，將只加入前 ${remaining} 個`);

                setUploadingFiles(true);
                try {
                    const added = [];
                    for (const f of toProcess) {
                        if (f.size > MAX_FILE_MB * 1024 * 1024) {
                            alert(`「${f.name}」超過 ${MAX_FILE_MB}MB，已略過`);
                            continue;
                        }
                        const url = supabase ? await uploadToStorage(f, 'docs') : URL.createObjectURL(f);
                        added.push({ name: f.name, url });
                    }
                    if (added.length) {
                        setNewProject(prev => ({ ...prev, files: [...prev.files, ...added].slice(0, MAX_FILES) }));
                    }
                } catch (err) {
                    alert("文件上傳失敗：" + err.message + "\n\n（若錯誤與 bucket 或權限有關，請先到 Supabase 建立 " + STORAGE_BUCKET + " 儲存空間並設定政策）");
                } finally {
                    setUploadingFiles(false);
                }
            };
            const handleRemoveFile = (idx) => {
                setNewProject(prev => ({ ...prev, files: prev.files.filter((_, i) => i !== idx) }));
            };

            // 🎬 上傳操作教學影片（1 部）
            const handleVideoUpload = async (e) => {
                const file = (e.target.files || [])[0];
                e.target.value = "";
                if (!file) return;
                if (!file.type.startsWith('video/')) {
                    alert("請上傳影片檔（mp4 / webm 等格式）");
                    return;
                }
                if (file.size > MAX_VIDEO_MB * 1024 * 1024) {
                    alert(`影片超過 ${MAX_VIDEO_MB}MB 上限，請先壓縮或剪輯後再上傳`);
                    return;
                }

                setUploadingVideo(true);
                try {
                    const url = supabase ? await uploadToStorage(file, 'videos') : URL.createObjectURL(file);
                    setNewProject(prev => ({ ...prev, video: url }));
                } catch (err) {
                    alert("影片上傳失敗：" + err.message + "\n\n（若錯誤與 bucket 或權限有關，請先到 Supabase 建立 " + STORAGE_BUCKET + " 儲存空間並設定政策）");
                } finally {
                    setUploadingVideo(false);
                }
            };
            const handleRemoveVideo = () => {
                setNewProject(prev => ({ ...prev, video: "" }));
            };

            // 開啟「編輯專案」彈窗
            const handleOpenEditProject = (item) => {
                if (!canManageProject(item)) {
                    alert("僅發布者本人可編輯此專案");
                    return;
                }
                setNewProject({
                    title: item.title || "",
                    type: item.type || "小工具",
                    dept: item.dept || "JJ",
                    author: item.author || "",
                    status: item.status || "規劃",
                    link: item.link || "",
                    images: parseImages(item.image_url),
                    files: parseFiles(item.files),
                    video: item.video_url || "",
                    pain_point: item.pain_point || "",
                    target: item.target || "",
                    solution: item.solution || "",
                    progress: item.progress || ""
                });
                setEditingProjectId(item.id);
                setShowProjectModal(true);
            };

            const handleCloseProjectModal = () => {
                setShowProjectModal(false);
                setEditingProjectId(null);
                resetProjectForm();
            };

            // 表單 → 資料庫欄位
            const buildProjectPayload = (form) => {
                const { images, files, video, ...rest } = form;
                return {
                    ...rest,
                    image_url: images && images.length > 0 ? JSON.stringify(images) : "",
                    files: files && files.length > 0 ? JSON.stringify(files) : "",
                    video_url: video || ""
                };
            };

            // 發布 或 更新 專案
            const handleAddProject = async (e) => {
                e.preventDefault();
                if (!newProject.title) return alert("請輸入專案名稱");
                if (uploadingFiles || uploadingVideo) return alert("檔案上傳中，請稍候再送出");

                setSubmitting(true);
                try {
                    if (editingProjectId) {
                        const original = projects.find(p => p.id === editingProjectId);
                        if (original && !canManageProject(original)) {
                            alert("僅發布者本人可編輯此專案");
                            setSubmitting(false);
                            return;
                        }

                        const updates = {
                            ...buildProjectPayload(newProject),
                            launch_date: newProject.status === "上線"
                                ? (original && original.launch_date && original.launch_date !== "-" ? original.launch_date : new Date().toLocaleDateString())
                                : "-"
                        };

                        if (supabase) {
                            const { data, error } = await supabase.from('projects').update(updates).eq('id', editingProjectId).select();
                            if (error) {
                                alert("更新失敗：" + error.message + "\n\n（若錯誤為找不到 files / video_url / progress 欄位，請先到 Supabase 為 projects 表補上欄位）");
                            } else {
                                setProjects(projects.map(p => p.id === editingProjectId ? { ...p, ...updates } : p));
                                if (original && original.status !== newProject.status) {
                                    insertComment(editingProjectId, `狀態由「${original.status}」變更為「${newProject.status}」`, 'system').catch(() => {});
                                }
                                handleCloseProjectModal();
                                alert("✅ 已更新專案");
                            }
                        } else {
                            setProjects(projects.map(p => p.id === editingProjectId ? { ...p, ...updates } : p));
                            if (original && original.status !== newProject.status) {
                                insertComment(editingProjectId, `狀態由「${original.status}」變更為「${newProject.status}」`, 'system').catch(() => {});
                            }
                            handleCloseProjectModal();
                            alert("✅ (本地模擬) 已更新專案");
                        }
                    } else {
                        const item = {
                            ...buildProjectPayload(newProject),
                            author: newProject.author || currentUser.name,
                            start_date: new Date().toLocaleDateString(),
                            launch_date: newProject.status === "上線" ? new Date().toLocaleDateString() : "-"
                        };

                        if (supabase) {
                            const { data, error } = await supabase.from('projects').insert([item]).select();
                            if (error) {
                                alert("發布失敗，請查看 Supabase 欄位是否齊全：" + error.message);
                            } else if (data) {
                                setProjects([data[0], ...projects]);
                                handleCloseProjectModal();
                                alert("🎉 發布成功！");
                            }
                        } else {
                            setProjects([{ id: Date.now(), ...item }, ...projects]);
                            handleCloseProjectModal();
                            alert("🎉 (本地模擬) 發布成功！");
                        }
                    }
                } catch (err) {
                    alert("連線發送失敗，請確認 Supabase 網址與 Key 是否正確！\n" + err.message);
                } finally {
                    setSubmitting(false);
                }
            };

            // 從公開網址反推 Storage 內的檔案路徑（供刪除用）
            const storagePathFromUrl = (url) => {
                const marker = `/${STORAGE_BUCKET}/`;
                const i = url.indexOf(marker);
                return i >= 0 ? decodeURIComponent(url.slice(i + marker.length)) : null;
            };

            // 刪除專案（僅發布者本人）
            const handleDeleteProject = async (item) => {
                if (!canManageProject(item)) {
                    alert("僅發布者本人可刪除此專案");
                    return;
                }
                if (!confirm(`確定要刪除專案「${item.title}」嗎？此動作無法復原。`)) return;

                try {
                    if (supabase) {
                        const { error } = await supabase.from('projects').delete().eq('id', item.id);
                        if (error) {
                            alert("刪除失敗：" + error.message);
                            return;
                        }
                        // 一併刪除留言與 Storage 上的附件（失敗不影響主要流程）
                        try { await supabase.from('comments').delete().eq('project_id', item.id); } catch (e) {}
                        try {
                            const urls = [...parseFiles(item.files).map(f => f.url), item.video_url].filter(Boolean);
                            const paths = urls.map(storagePathFromUrl).filter(Boolean);
                            if (paths.length) await supabase.storage.from(STORAGE_BUCKET).remove(paths);
                        } catch (e) {}
                    }
                    setProjects(projects.filter(p => p.id !== item.id));
                    setComments(prev => prev.filter(c => c.project_id !== item.id));
                    if (viewingProjectId === item.id) setViewingProjectId(null);
                } catch (err) {
                    alert("刪除失敗，請確認連線是否正常！\n" + err.message);
                }
            };

            const resetProjectForm = () => {
                setNewProject({
                    title: "", type: "小工具", dept: "JJ", author: "", status: "規劃",
                    link: "", images: [], files: [], video: "",
                    pain_point: "", target: "", solution: "", progress: ""
                });
            };

            // 新增成員帳號（僅 ADMIN）
            const handleAddUser = async (e) => {
                e.preventDefault();
                if (currentUser.role !== "ADMIN") return alert("僅管理員可新增成員帳號");
                if (!newUser.name || !newUser.account || !newUser.password) {
                    return alert("請填寫完整資訊（暱稱、帳號、密碼皆為必填）");
                }
                if (!ACCOUNT_REGEX.test(newUser.account)) {
                    return alert("帳號格式錯誤：需為英文字母＋數字組合（例如 user01）");
                }
                if (!PASSWORD_REGEX.test(newUser.password)) {
                    return alert("密碼格式錯誤：需為 6 位數字（例如 123456）");
                }
                if (users.some(u => u.account === newUser.account)) {
                    return alert("此帳號已被使用，請更換其他帳號");
                }

                const shift = newUser.unit.includes('-') ? newUser.unit.split('-')[1] : '早';
                const userItem = { ...newUser, shift, status: 'active' };

                if (supabase) {
                    const { data, error } = await supabase.from('profiles').insert([userItem]).select();
                    if (error) {
                        alert("新增失敗：" + error.message);
                    } else if (data) {
                        setUsers([...users, data[0]]);
                        setShowUserModal(false);
                        setNewUser({ name: "", account: "", password: "", email: "", role: "ADMIN", unit: "JJ-早", shift: "早" });
                        alert("🎉 成員帳號新增成功！");
                    }
                } else {
                    setUsers([...users, { id: String(users.length + 1), ...userItem }]);
                    setShowUserModal(false);
                    setNewUser({ name: "", account: "", password: "", email: "", role: "ADMIN", unit: "JJ-早", shift: "早" });
                    alert("🎉 (本地模擬) 成員帳號新增成功！");
                }
            };

            // 停用 / 啟用
            const handleToggleUserStatus = async (u) => {
                if (currentUser.role !== "ADMIN") return alert("僅管理員可操作");
                if (u.account === currentUser.account) return alert("不能停用自己的帳號");

                const isDisabled = u.status === 'disabled';
                const nextStatus = isDisabled ? 'active' : 'disabled';
                const actionText = isDisabled ? '啟用' : '停用';
                if (!confirm(`確定要${actionText}帳號「${u.name}（${u.account}）」嗎？`)) return;

                try {
                    if (supabase) {
                        const { error } = await supabase.from('profiles').update({ status: nextStatus }).eq('id', u.id);
                        if (error) {
                            alert(`${actionText}失敗：` + error.message);
                            return;
                        }
                    }
                    setUsers(users.map(x => x.id === u.id ? { ...x, status: nextStatus } : x));
                    alert(`✅ 已${actionText}帳號「${u.name}」`);
                } catch (err) {
                    alert(`${actionText}失敗，請確認連線是否正常！\n` + err.message);
                }
            };

            // 開啟編輯成員彈窗
            const handleOpenEditUser = (u) => {
                setEditUserTarget(u);
                setEditUserForm({
                    name: u.name || "",
                    role: u.role || "MEMBER",
                    unit: UNIT_OPTIONS.includes(u.unit) ? u.unit : "JJ-早",
                    password: ""
                });
            };

            // 儲存成員編輯
            const handleSaveEditUser = async (e) => {
                e.preventDefault();
                if (!editUserTarget) return;
                if (currentUser.role !== "ADMIN") return alert("僅管理員可操作");

                const newName = editUserForm.name.trim();
                if (!newName) return alert("暱稱不可為空");
                if (editUserForm.password && !PASSWORD_REGEX.test(editUserForm.password)) {
                    return alert("密碼格式錯誤：需為 6 位數字（留空則不變更）");
                }
                if (editUserTarget.account === currentUser.account && editUserForm.role !== "ADMIN") {
                    return alert("不能移除自己的管理員權限");
                }

                const shift = editUserForm.unit.includes('-') ? editUserForm.unit.split('-')[1] : '早';
                const updates = { name: newName, role: editUserForm.role, unit: editUserForm.unit, shift };
                if (editUserForm.password) updates.password = editUserForm.password;

                const oldName = editUserTarget.name;
                const nameChanged = oldName !== newName;

                setEditUserSaving(true);
                try {
                    if (supabase) {
                        const { error } = await supabase.from('profiles').update(updates).eq('id', editUserTarget.id);
                        if (error) {
                            alert("儲存失敗：" + error.message);
                            setEditUserSaving(false);
                            return;
                        }
                        if (nameChanged) {
                            const { error: projErr } = await supabase.from('projects').update({ author: newName }).eq('author', oldName);
                            if (projErr) console.error("同步專案負責人失敗：", projErr);
                        }
                    }
                    setUsers(users.map(x => x.id === editUserTarget.id ? { ...x, ...updates } : x));
                    if (nameChanged) {
                        setProjects(projects.map(p => p.author === oldName ? { ...p, author: newName } : p));
                        if (editUserTarget.account === currentUser.account) {
                            const updatedSelf = { ...currentUser, name: newName };
                            setCurrentUser(updatedSelf);
                            writeSession(updatedSelf);
                        }
                    }
                    setEditUserTarget(null);
                    alert("✅ 已儲存成員資料");
                } catch (err) {
                    alert("儲存失敗，請確認連線是否正常！\n" + err.message);
                } finally {
                    setEditUserSaving(false);
                }
            };

            // 刪除成員帳號
            const handleDeleteUser = async (u) => {
                if (currentUser.role !== "ADMIN") return alert("僅管理員可操作");
                if (u.account === currentUser.account) return alert("不能刪除自己的帳號");
                if (projects.some(p => p.author === u.name)) {
                    return alert(`「${u.name}」仍是某些專案的負責人，無法刪除。\n請先請本人處理其專案（可改用「停用」）。`);
                }
                if (!confirm(`確定要刪除帳號「${u.name}（${u.account}）」嗎？此動作無法復原。`)) return;

                try {
                    if (supabase) {
                        const { error } = await supabase.from('profiles').delete().eq('id', u.id);
                        if (error) {
                            alert("刪除失敗：" + error.message);
                            return;
                        }
                    }
                    setUsers(users.filter(x => x.id !== u.id));
                    setEditUserTarget(null);
                    alert(`✅ 已刪除帳號「${u.name}」`);
                } catch (err) {
                    alert("刪除失敗，請確認連線是否正常！\n" + err.message);
                }
            };

            // ===== 留言與更新紀錄 =====
            const insertComment = async (projectId, content, kind) => {
                const item = {
                    project_id: projectId,
                    author: currentUser ? currentUser.name : "",
                    content,
                    kind,
                    created_at: new Date().toISOString()
                };
                if (supabase) {
                    const { data, error } = await supabase.from('comments').insert([item]).select();
                    if (error) throw error;
                    if (data) setComments(prev => [...prev, data[0]]);
                } else {
                    setComments(prev => [...prev, { id: Date.now(), ...item }]);
                }
            };

            const handlePostComment = async () => {
                const content = newComment.trim();
                if (!content || !viewingProject) return;
                setPostingComment(true);
                try {
                    await insertComment(viewingProject.id, content, 'comment');
                    setNewComment("");
                } catch (err) {
                    alert("留言失敗：" + err.message);
                } finally {
                    setPostingComment(false);
                }
            };

            const canDeleteComment = (c) => {
                if (!currentUser) return false;
                return c.author === currentUser.name || currentUser.role === "ADMIN";
            };

            const handleDeleteComment = async (c) => {
                if (!canDeleteComment(c)) return;
                if (!confirm("確定要刪除這則紀錄嗎？")) return;
                try {
                    if (supabase) {
                        const { error } = await supabase.from('comments').delete().eq('id', c.id);
                        if (error) { alert("刪除失敗：" + error.message); return; }
                    }
                    setComments(prev => prev.filter(x => x.id !== c.id));
                } catch (err) {
                    alert("刪除失敗：" + err.message);
                }
            };

            const formatTime = (t) => {
                if (!t) return "";
                try { return new Date(t).toLocaleString('zh-TW', { hour12: false }); } catch (e) { return String(t); }
            };

            // ===== 專案搜尋 / 篩選 =====
            const filteredProjects = useMemo(() => {
                const kw = searchText.trim().toLowerCase();
                return projects.filter(p => {
                    if (filterStatus !== "全部" && p.status !== filterStatus) return false;
                    if (filterAuthor !== "全部" && p.author !== filterAuthor) return false;
                    if (filterType !== "全部" && p.type !== filterType) return false;
                    if (kw) {
                        const hay = [p.title, p.author, p.dept, p.pain_point, p.target, p.solution, p.progress]
                            .filter(Boolean).join(" ").toLowerCase();
                        if (!hay.includes(kw)) return false;
                    }
                    return true;
                });
            }, [projects, searchText, filterStatus, filterAuthor, filterType]);

            const hasActiveFilter = searchText.trim() !== "" || filterStatus !== "全部" || filterAuthor !== "全部" || filterType !== "全部";
            const clearFilters = () => { setSearchText(""); setFilterStatus("全部"); setFilterAuthor("全部"); setFilterType("全部"); };

            // ===== 單位成員統計 =====
            const memberStats = useMemo(() => {
                const list = users.map(u => {
                    const ps = projects.filter(p => p.author === u.name);
                    const counts = {};
                    STATUS_LIST.forEach(s => counts[s] = ps.filter(p => p.status === s).length);
                    return { user: u, projects: ps, counts, total: ps.length };
                }).sort((a, b) => (b.counts["上線"] - a.counts["上線"]) || (b.total - a.total));
                return list.map((m, i) => ({ ...m, rank: i + 1 }));
            }, [users, projects]);

            const unitGroups = useMemo(() => {
                const groups = {};
                memberStats.forEach(m => {
                    const unit = getBaseUnit(m.user);
                    if (!groups[unit]) groups[unit] = [];
                    groups[unit].push(m);
                });
                return groups;
            }, [memberStats]);

            const viewingProject = viewingProjectId != null
                ? projects.find(p => p.id === viewingProjectId)
                : null;

            const openProjectDetail = (item) => {
                setViewingProjectId(item.id);
                setCurrentTab("專案列表");
                window.scrollTo(0, 0);
            };

            // 深淺色切換按鈕
            const ThemeToggle = () => (
                <button
                    type="button"
                    onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')}
                    className="btn-ghost px-3 py-1.5 rounded-full text-xs font-semibold"
                    title="切換深／淺色模式"
                >
                    {theme === 'dark' ? '🌙 深色' : '☀️ 淺色'}
                </button>
            );

            // ===== 還原登入狀態中 =====
            if (restoring) {
                return (
                    <div className="min-h-screen flex items-center justify-center">
                        <div className="text-center">
                            <span className="font-black text-xl logo px-3 py-1.5 rounded inline-block">AI 成果</span>
                            <p className="t3 text-sm mt-4">載入中...</p>
                        </div>
                    </div>
                );
            }

            // ===== 登入畫面 =====
            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 relative">
                        <div className="absolute top-4 right-4"><ThemeToggle /></div>
                        <div className="w-full max-w-sm">
                            <div className="text-center mb-6">
                                <span className="font-black text-xl logo px-3 py-1.5 rounded inline-block">AI 成果</span>
                                <p className="t2 text-sm mt-3">請登入以管理專案與成員</p>
                            </div>
                            {sessionNotice && (
                                <p className="text-xs t2 app-panel rounded-lg px-3 py-2 mb-3 text-center">⏰ {sessionNotice}</p>
                            )}
                            <form onSubmit={handleLogin} className="app-card rounded-2xl p-6 space-y-4">
                                <div>
                                    <label className="text-xs t3 block mb-1">帳號</label>
                                    <input
                                        type="text"
                                        required
                                        autoFocus
                                        className="w-full p-2.5 rounded-lg app-input text-sm"
                                        value={loginForm.account}
                                        onChange={e => setLoginForm({ ...loginForm, account: e.target.value })}
                                        placeholder="例如：user01"
                                    />
                                </div>
                                <div>
                                    <label className="text-xs t3 block mb-1">密碼</label>
                                    <input
                                        type="password"
                                        required
                                        inputMode="numeric"
                                        maxLength="6"
                                        className="w-full p-2.5 rounded-lg app-input text-sm"
                                        value={loginForm.password}
                                        onChange={e => setLoginForm({ ...loginForm, password: e.target.value.replace(/\D/g, '').slice(0, 6) })}
                                        placeholder="6 位數字"
                                    />
                                </div>
                                {loginError && (
                                    <p className="text-xs danger app-panel rounded-lg px-3 py-2">{loginError}</p>
                                )}
                                <button
                                    type="submit"
                                    disabled={loggingIn}
                                    className="w-full py-2.5 btn-accent font-bold text-sm rounded-lg disabled:opacity-50"
                                >
                                    {loggingIn ? "登入中..." : "登入"}
                                </button>
                            </form>
                            <p className="text-[11px] t3 text-center mt-4">閒置超過 4 小時會自動登出</p>
                            {!isConfigured && (
                                <p className="text-[11px] t3 text-center mt-2">
                                    本地模擬模式測試帳號：admin01 / 123456（ADMIN）、usera01 / 111111（MEMBER）
                                </p>
                            )}
                        </div>
                    </div>
                );
            }

            const visibleTabs = currentUser.role === "ADMIN"
                ? ["專案列表", "單位成員", "帳號管理"]
                : ["專案列表", "單位成員"];

            return (
                <div className="min-h-screen">
                    {/* 導覽列 */}

                        >
                            <button
                                onClick={() => setLightboxUrl(null)}
                                className="absolute top-4 right-6 text-gray-200 hover:text-white text-3xl font-light"
                                title="關閉 (Esc)"
                            >
                                ✕
                            </button>
                            <img
                                src={lightboxUrl}
                                alt="放大顯示"
                                className="max-w-full max-h-full rounded-lg shadow-2xl object-contain"
                                onClick={e => e.stopPropagation()}
                            />
                        </div>
                    )}

                    {/* ===== 彈窗：編輯成員帳號 ===== */}
                    {editUserTarget && currentUser.role === "ADMIN" && (
                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50 overflow-y-auto">
                            <div className="app-card p-6 rounded-2xl w-full max-w-md my-8">
                                <div className="flex items-center justify-between mb-4">
                                    <h2 className="text-xl font-bold t1">✏️ 編輯帳號</h2>
                                    <button onClick={() => setEditUserTarget(null)} className="t3 hover:opacity-70 text-xl leading-none">✕</button>
                                </div>
                                <p className="text-xs t3 mb-4">帳號：{editUserTarget.account}</p>

                                <form onSubmit={handleSaveEditUser} className="space-y-4">
                                    <div>
                                        <label className="text-xs t3 block mb-1">暱稱（畫面顯示為負責人）</label>
                                        <input
                                            type="text"
                                            required
                                            className="w-full p-2.5 rounded-lg app-input text-sm"
                                            value={editUserForm.name}
                                            onChange={e => setEditUserForm({ ...editUserForm, name: e.target.value })}
                                        />
                                        <p className="text-[11px] t3 mt-1">修改暱稱會同步更新其名下所有專案的負責人名稱</p>
                                    </div>

                                    <div>
                                        <label className="text-xs t3 block mb-1">權限</label>
                                        <div className="grid grid-cols-2 gap-0 rounded-lg overflow-hidden border bd">
                                            <button
                                                type="button"
                                                onClick={() => setEditUserForm({ ...editUserForm, role: "MEMBER" })}
                                                className={`py-2 text-sm font-semibold transition-colors ${editUserForm.role === "MEMBER" ? 'btn-accent' : 'btn-ghost border-0 rounded-none'}`}
                                            >
                                                一般成員
                                            </button>
                                            <button
                                                type="button"
                                                onClick={() => setEditUserForm({ ...editUserForm, role: "ADMIN" })}
                                                className={`py-2 text-sm font-semibold transition-colors ${editUserForm.role === "ADMIN" ? 'btn-accent' : 'btn-ghost border-0 rounded-none'}`}
                                            >
                                                管理者
                                            </button>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="text-xs t3 block mb-1">所屬單位（含班別）</label>
                                        <div className="flex gap-2">
                                            {UNIT_OPTIONS.map(opt => (
                                                <button
                                                    key={opt}
                                                    type="button"
                                                    onClick={() => setEditUserForm({ ...editUserForm, unit: opt })}
                                                    className={`px-4 py-2 rounded-lg text-sm font-semibold transition-colors ${editUserForm.unit === opt ? 'btn-accent' : 'btn-ghost'}`}
                                                >
                                                    {opt}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div>
                                        <label className="text-xs t3 block mb-1">重設密碼（留空＝不改）</label>
                                        <input
                                            type="password"
                                            inputMode="numeric"
                                            maxLength="6"
                                            className="w-full p-2.5 rounded-lg app-input text-sm"
                                            value={editUserForm.password}
                                            onChange={e => setEditUserForm({ ...editUserForm, password: e.target.value.replace(/\D/g, '').slice(0, 6) })}
                                            placeholder="留空則不變更"
                                        />
                                        <p className="text-[11px] t3 mt-1">需為 6 位數字，例如 123456</p>
                                    </div>

                                    <div className="grid grid-cols-2 gap-2 pt-2">
                                        <button
                                            type="button"
                                            onClick={() => setEditUserTarget(null)}
                                            className="py-2.5 rounded-lg text-sm font-semibold btn-ghost"
                                        >
                                            取消
                                        </button>
                                        <button
                                            type="submit"
                                            disabled={editUserSaving}
                                            className="py-2.5 rounded-lg text-sm font-bold btn-accent disabled:opacity-50"
                                        >
                                            {editUserSaving ? '儲存中...' : '儲存'}
                                        </button>
                                    </div>

                                    {editUserTarget.account !== currentUser.account && (
                                        <div className="pt-1">
                                            <button
                                                type="button"
                                                onClick={() => handleDeleteUser(editUserTarget)}
                                                className="w-full py-2.5 rounded-lg text-sm font-bold btn-danger"
                                            >
                                                刪除此帳號
                                            </button>
                                            <p className="text-[11px] t3 text-center mt-2">帳號若仍是某專案的負責人則無法刪除</p>
                                        </div>
                                    )}
                                </form>
                            </div>
                        </div>
                    )}

                    {/* ===== 彈窗：發布／編輯 AI 專案 ===== */}
                    {showProjectModal && (
                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50 overflow-y-auto">
                            <div className="app-card p-6 rounded-2xl w-full max-w-lg my-8">
                                <h2 className="text-xl font-bold mb-4 t1">{editingProjectId ? "✏️ 編輯專案" : "發布 AI 專案"}</h2>
                                <form onSubmit={handleAddProject} className="space-y-3">
                                    <div>
                                        <label className="text-xs t3 block mb-1">專案名稱</label>
                                        <input type="text" required className="w-full p-2.5 rounded-lg app-input text-sm" value={newProject.title} onChange={e => setNewProject({...newProject, title: e.target.value})} placeholder="例如：客服文字自動發信工具" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="text-xs t3 block mb-1">類型</label>
                                            <select className="w-full p-2.5 rounded-lg app-input text-sm" value={newProject.type} onChange={e => setNewProject({...newProject, type: e.target.value})}>
                                                <option value="小工具">小工具</option>
                                                <option value="專案">專案</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-xs t3 block mb-1">狀態</label>
                                            <select className="w-full p-2.5 rounded-lg app-input text-sm" value={newProject.status} onChange={e => setNewProject({...newProject, status: e.target.value})}>
                                                <option value="規劃">規劃</option>
                                                <option value="開發">開發</option>
                                                <option value="測試">測試</option>
                                                <option value="上線">上線</option>
                                                <option value="下線">下線</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="text-xs t3 block mb-1">單位</label>
                                            <input type="text" className="w-full p-2.5 rounded-lg app-input text-sm" value={newProject.dept} onChange={e => setNewProject({...newProject, dept: e.target.value})} />
                                        </div>
                                        <div>
                                            <label className="text-xs t3 block mb-1">發布者 / 負責人</label>
                                            <select disabled={!!editingProjectId} className="w-full p-2.5 rounded-lg app-input text-sm" value={newProject.author || currentUser.name} onChange={e => setNewProject({...newProject, author: e.target.value})}>
                                                {users.map(user => (
                                                    <option key={user.id} value={user.name}>{user.name}</option>
                                                ))}
                                            </select>
                                            {editingProjectId && <p className="text-[11px] t3 mt-1">編輯時發布者不可更改</p>}
                                        </div>
                                    </div>

                                    <div>
                                        <label className="text-xs sec-pain block mb-1">🚨 痛點描述 (目前現況與問題點)</label>
                                        <textarea rows="2" className="w-full p-2.5 rounded-lg app-input text-sm" value={newProject.pain_point} onChange={e => setNewProject({...newProject, pain_point: e.target.value})} placeholder="例如：聽錄音檔太煩..."></textarea>
                                    </div>
                                    <div>
                                        <label className="text-xs sec-target block mb-1">🎯 預期目標</label>
                                        <input type="text" className="w-full p-2.5 rounded-lg app-input text-sm" value={newProject.target} onChange={e => setNewProject({...newProject, target: e.target.value})} placeholder="例如：快速知道錄音內容" />
                                    </div>
                                    <div>
                                        <label className="text-xs sec-solution block mb-1">⚡ 優化方法</label>
                                        <textarea rows="2" className="w-full p-2.5 rounded-lg app-input text-sm" value={newProject.solution} onChange={e => setNewProject({...newProject, solution: e.target.value})} placeholder="例如：利用該網址轉化文字..."></textarea>
                                    </div>
                                    <div>
                                        <label className="text-xs sec-progress block mb-1">📈 目前進展</label>
                                        <textarea rows="2" className="w-full p-2.5 rounded-lg app-input text-sm" value={newProject.progress} onChange={e => setNewProject({...newProject, progress: e.target.value})} placeholder="例如：已完成核心功能，剩介面調整與測試..."></textarea>
                                    </div>

                                    <div>
                                        <label className="text-xs t3 block mb-1">專案網址 (URL)</label>
                                        <input type="url" className="w-full p-2.5 rounded-lg app-input text-sm" value={newProject.link} onChange={e => setNewProject({...newProject, link: e.target.value})} placeholder="https://" />
                                    </div>

                                    {/* 成果附圖 */}
                                    <div>
                                        <label className="text-xs t3 block mb-1">📷 成果附圖（最多 {MAX_IMAGES} 張，可一次多選，點 ✕ 可刪除）</label>
                                        <input
                                            type="file"
                                            accept="image/*"
                                            multiple
                                            onChange={handleImageUpload}
                                            disabled={newProject.images.length >= MAX_IMAGES}
                                            className="w-full p-2 rounded-lg app-input app-file text-xs"
                                        />
                                        <p className="text-[11px] t3 mt-1">已上傳 {newProject.images.length} / {MAX_IMAGES} 張</p>
                                        {newProject.images.length > 0 && (
                                            <div className="mt-2 flex flex-wrap gap-2">
                                                {newProject.images.map((img, idx) => (
                                                    <div key={idx} className="relative">
                                                        <img src={img} alt={`預覽 ${idx + 1}`} className="h-24 w-24 rounded border bd object-cover" />
                                                        <button
                                                            type="button"
                                                            onClick={() => handleRemoveImage(idx)}
                                                            title="刪除這張圖"
                                                            className="absolute -top-2 -right-2 w-6 h-6 rounded-full bg-red-500 hover:bg-red-400 text-white text-xs font-bold flex items-center justify-center shadow-lg"
                                                        >
                                                            ✕
                                                        </button>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>

                                    {/* 相關文件 */}
                                    <div>
                                        <label className="text-xs t3 block mb-1">📎 相關文件（txt / pdf / office 等，最多 {MAX_FILES} 個，每個 ≤ {MAX_FILE_MB}MB）</label>
                                        <input
                                            type="file"
                                            accept=".txt,.md,.csv,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx"
                                            multiple
                                            onChange={handleDocUpload}
                                            disabled={uploadingFiles || newProject.files.length >= MAX_FILES}
                                            className="w-full p-2 rounded-lg app-input app-file text-xs"
                                        />
                                        <p className="text-[11px] t3 mt-1">
                                            {uploadingFiles ? '⏳ 文件上傳中...' : `已上傳 ${newProject.files.length} / ${MAX_FILES} 個`}
                                        </p>
                                        {newProject.files.length > 0 && (
                                            <ul className="mt-2 space-y-1.5">
                                                {newProject.files.map((f, idx) => (
                                                    <li key={idx} className="flex items-center justify-between gap-2 app-panel rounded-lg px-3 py-1.5">
                                                        <span className="text-xs t1 truncate">📄 {f.name}</span>
                                                        <button
                                                            type="button"
                                                            onClick={() => handleRemoveFile(idx)}
                                                            className="text-xs danger hover:opacity-70 shrink-0"
                                                        >
                                                            ✕ 刪除
                                                        </button>
                                                    </li>
                                                ))}
                                            </ul>
                                        )}
                                    </div>

                                    {/* 操作教學影片 */}
                                    <div>
                                        <label className="text-xs t3 block mb-1">🎬 操作教學影片（1 部，≤ {MAX_VIDEO_MB}MB，mp4 / webm）</label>
                                        {newProject.video ? (
                                            <div className="space-y-2">
                                                <video src={newProject.video} controls className="w-full max-h-48 rounded-lg border bd bg-black"></video>
                                                <button
                                                    type="button"
                                                    onClick={handleRemoveVideo}
                                                    className="text-xs btn-danger px-2.5 py-1 rounded-md"
                                                >
                                                    ✕ 移除影片
                                                </button>
                                            </div>
                                        ) : (
                                            <React.Fragment>
                                                <input
                                                    type="file"
                                                    accept="video/*"
                                                    onChange={handleVideoUpload}
                                                    disabled={uploadingVideo}
                                                    className="w-full p-2 rounded-lg app-input app-file text-xs"
                                                />
                                                {uploadingVideo && <p className="text-[11px] t3 mt-1">⏳ 影片上傳中，請稍候（依檔案大小可能需要一點時間）...</p>}
                                            </React.Fragment>
                                        )}
                                    </div>

                                    <div className="flex justify-end gap-2 pt-3">
                                        <button type="button" onClick={handleCloseProjectModal} className="px-4 py-2 t3 text-sm hover:opacity-70">取消</button>
                                        <button type="submit" disabled={submitting || uploadingFiles || uploadingVideo} className="px-5 py-2 btn-accent font-bold text-sm rounded-lg disabled:opacity-50">
                                            {submitting ? (editingProjectId ? '更新中...' : '發布中...') : (editingProjectId ? '儲存變更' : '確認發布')}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* ===== 彈窗：新增成員帳號 ===== */}
                    {showUserModal && currentUser.role === "ADMIN" && (
                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
                            <div className="app-card p-6 rounded-2xl w-full max-w-md">
                                <h2 className="text-xl font-bold mb-4 t1">👤 新增成員帳號</h2>
                                <form onSubmit={handleAddUser} className="space-y-3">
                                    <div>
                                        <label className="text-xs t3 block mb-1">成員暱稱</label>
                                        <input type="text" required className="w-full p-2.5 rounded-lg app-input text-sm" value={newUser.name} onChange={e => setNewUser({...newUser, name: e.target.value})} placeholder="例如：成員 B" />
                                    </div>
                                    <div>
                                        <label className="text-xs t3 block mb-1">帳號（英文＋數字組合）</label>
                                        <input
                                            type="text"
                                            required
                                            pattern="^(?=.*[A-Za-z])(?=.*\d)[A-Za-z0-9]+$"
                                            title="帳號需同時包含英文字母與數字"
                                            className="w-full p-2.5 rounded-lg app-input text-sm"
                                            value={newUser.account}
                                            onChange={e => setNewUser({...newUser, account: e.target.value})}
                                            placeholder="例如：user01"
                                        />
                                        <p className="text-[11px] t3 mt-1">需同時包含英文字母與數字，例如 user01</p>
                                    </div>
                                    <div>
                                        <label className="text-xs t3 block mb-1">密碼（6 位數字）</label>
                                        <input
                                            type="password"
                                            required
                                            inputMode="numeric"
                                            pattern="^\d{6}$"
                                            maxLength="6"
                                            title="密碼需為 6 位數字"
                                            className="w-full p-2.5 rounded-lg app-input text-sm"
                                            value={newUser.password}
                                            onChange={e => setNewUser({...newUser, password: e.target.value.replace(/\D/g, '').slice(0, 6)})}
                                            placeholder="例如：123456"
                                        />
                                        <p className="text-[11px] t3 mt-1">固定 6 位數字，例如 123456</p>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="text-xs t3 block mb-1">單位（含班別）</label>
                                            <select className="w-full p-2.5 rounded-lg app-input text-sm" value={newUser.unit} onChange={e => setNewUser({...newUser, unit: e.target.value})}>
                                                {UNIT_OPTIONS.map(opt => (
                                                    <option key={opt} value={opt}>{opt}</option>
                                                ))}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-xs t3 block mb-1">權限角色</label>
                                            <select className="w-full p-2.5 rounded-lg app-input text-sm" value={newUser.role} onChange={e => setNewUser({...newUser, role: e.target.value})}>
                                                <option value="ADMIN">ADMIN</option>
                                                <option value="MEMBER">MEMBER</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div className="flex justify-end gap-2 pt-3">
                                        <button type="button" onClick={() => setShowUserModal(false)} className="px-4 py-2 t3 text-sm hover:opacity-70">取消</button>
                                        <button type="submit" className="px-5 py-2 btn-accent font-bold text-sm rounded-lg">確認新增</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
