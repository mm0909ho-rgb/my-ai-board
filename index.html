<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 成果 Dashboard</title>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 中文字型：思源黑體（同時載入繁體 TC 與簡體 SC，避免簡繁混排字型不一）-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- Supabase JS SDK -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <style>
        /* ============ 柔和雙主題色彩系統 ============ */
        :root, body[data-theme="dark"] {
            --bg: #171a24;              /* 深靛灰藍背景 */
            --card: #212634;            /* 卡片 */
            --panel: #1c202b;           /* 內層面板 */
            --border: #363c4d;
            --input: #2a2f3d;
            --text-1: #e7e9f0;          /* 主文字 */
            --text-2: #b6bcc9;          /* 次文字 */
            --text-3: #868da0;          /* 弱文字 */
            --accent: #8fa0ea;          /* 柔和靛藍 */
            --accent-strong: #7c8fe2;
            --accent-text: #171d3a;
            --accent-soft: rgba(143, 160, 234, .14);
            --danger: #e08f8f;
            --danger-soft: rgba(224, 143, 143, .12);
            --danger-border: rgba(224, 143, 143, .38);
            --link: #93b7e6;
            --shadow: 0 4px 18px rgba(0, 0, 0, .32);
        }
        body[data-theme="light"] {
            --bg: #f3f2ee;              /* 柔和暖灰白，不刺眼 */
            --card: #ffffff;
            --panel: #f4f4f1;
            --border: #e3e2dc;
            --input: #f0efeb;
            --text-1: #2b2f3a;
            --text-2: #565c6b;
            --text-3: #8b91a1;
            --accent: #4f62c8;
            --accent-strong: #4354bd;
            --accent-text: #ffffff;
            --accent-soft: rgba(79, 98, 200, .10);
            --danger: #c76e6e;
            --danger-soft: rgba(199, 110, 110, .10);
            --danger-border: rgba(199, 110, 110, .35);
            --link: #4f6fc0;
            --shadow: 0 4px 16px rgba(45, 50, 66, .06);
        }

        body {
            background: var(--bg);
            color: var(--text-1);
            font-family: "Noto Sans SC", "Noto Sans TC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 15px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: background-color .25s ease, color .25s ease;
        }

        /* 頁面標題群組 */
        .page-eyebrow { font-size: 12px; letter-spacing: .18em; font-weight: 700; color: var(--text-3); }
        .page-title { font-size: 30px; font-weight: 900; letter-spacing: -.01em; line-height: 1.15; color: var(--text-1); }
        .page-sub { font-size: 14px; color: var(--text-2); }

        .app-card  { background: var(--card);  border: 1px solid var(--border); box-shadow: var(--shadow); }
        .app-panel { background: var(--panel); border: 1px solid var(--border); }
        .app-input { background: var(--input); border: 1px solid var(--border); color: var(--text-1); }
        .app-input::placeholder { color: var(--text-3); }
        .app-input:focus { border-color: var(--accent); outline: none; }
        .app-input:disabled { opacity: .5; }
        .app-file::file-selector-button {
            background: var(--accent); color: var(--accent-text);
            border: none; border-radius: 6px; padding: 4px 12px; margin-right: 12px;
            font-weight: 700; cursor: pointer;
        }

        .t1 { color: var(--text-1); } .t2 { color: var(--text-2); } .t3 { color: var(--text-3); }
        .accent { color: var(--accent); }
        .danger { color: var(--danger); }
        .link { color: var(--link); }
        .bd { border-color: var(--border) !important; }

        .btn-accent { background: var(--accent); color: var(--accent-text); transition: background .15s; }
        .btn-accent:hover:not(:disabled) { background: var(--accent-strong); }
        .btn-ghost { background: var(--input); color: var(--text-2); border: 1px solid var(--border); transition: filter .15s; }
        .btn-ghost:hover { filter: brightness(1.08); }
        .btn-danger { background: var(--danger-soft); color: var(--danger); border: 1px solid var(--danger-border); transition: filter .15s; }
        .btn-danger:hover { filter: brightness(1.12); }
        .btn-accent-soft { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent); }

        .logo { background: var(--accent); color: var(--accent-text); }
        .navpill { color: var(--text-2); }
        .navpill:hover { background: var(--input); }
        .navpill-active { background: var(--accent); color: var(--accent-text); font-weight: 700; }

        /* 狀態標籤（柔和版，雙主題） */
        body[data-theme="dark"] .tag-status-規劃 { background: #2a2e38; color: #9aa1ac; border: 1px solid #3b4150; }
        body[data-theme="dark"] .tag-status-開發 { background: rgba(120, 160, 220, .14); color: #93b3e0; border: 1px solid rgba(120, 160, 220, .38); }
        body[data-theme="dark"] .tag-status-測試 { background: rgba(220, 185, 115, .14); color: #dfc18a; border: 1px solid rgba(220, 185, 115, .38); }
        body[data-theme="dark"] .tag-status-上線 { background: rgba(111, 194, 150, .14); color: #85cba5; border: 1px solid rgba(111, 194, 150, .38); }
        body[data-theme="dark"] .tag-status-下線 { background: rgba(224, 143, 143, .13); color: #e2a0a0; border: 1px solid rgba(224, 143, 143, .36); }
        body[data-theme="dark"] .tag-status-開發測試中 { background: rgba(125, 190, 220, .14); color: #8ec6dd; border: 1px solid rgba(125, 190, 220, .38); }
        body[data-theme="light"] .tag-status-規劃 { background: #edebe4; color: #7c828b; border: 1px solid #dcd8cd; }
        body[data-theme="light"] .tag-status-開發 { background: #e9f0f9; color: #5077b3; border: 1px solid #ccdcf0; }
        body[data-theme="light"] .tag-status-測試 { background: #f8f0dd; color: #9d8040; border: 1px solid #eadcb4; }
        body[data-theme="light"] .tag-status-上線 { background: #e6f2eb; color: #3f8b64; border: 1px solid #c6e1d1; }
        body[data-theme="light"] .tag-status-下線 { background: #f6e8e8; color: #ad6161; border: 1px solid #eacccc; }
        body[data-theme="light"] .tag-status-開發測試中 { background: #e6f2f8; color: #46809f; border: 1px solid #c5e0ee; }

        /* 專案卡片左側狀態色邊條 */
        .edge-開發測試中 { border-left: 5px solid #7dbedc; }
        .edge-上線 { border-left: 5px solid #6fc296; }
        .edge-下線 { border-left: 5px solid #e08f8f; }

        /* 類型標籤配色：工具=黃綠、專案=靛藍 */
        body[data-theme="dark"] .tag-type-工具 { background: rgba(150, 200, 90, .16); color: #b3d97a; border: 1px solid rgba(150, 200, 90, .4); }
        body[data-theme="dark"] .tag-type-專案 { background: rgba(143, 160, 234, .16); color: #a6b3ea; border: 1px solid rgba(143, 160, 234, .4); }
        body[data-theme="light"] .tag-type-工具 { background: #eef6dd; color: #5c7a1e; border: 1px solid #d9e9b8; }
        body[data-theme="light"] .tag-type-專案 { background: #e9ecfb; color: #4453b5; border: 1px solid #cdd4f2; }

        /* 負責人名稱：醒目字體 */
        .owner-name {
            font-family: "Noto Sans SC", "Noto Sans TC", -apple-system, "PingFang TC", sans-serif;
            font-weight: 900;
            color: var(--accent);
            letter-spacing: .01em;
        }

        /* 區塊標題色（柔和版） */
        body[data-theme="dark"] .sec-pain     { color: #dd9797; } body[data-theme="light"] .sec-pain     { color: #b56a6a; }
        body[data-theme="dark"] .sec-target   { color: #93b3e0; } body[data-theme="light"] .sec-target   { color: #5077b3; }
        .sec-solution { color: var(--accent); }
        body[data-theme="dark"] .sec-progress { color: #dfc18a; } body[data-theme="light"] .sec-progress { color: #9d8040; }
        body[data-theme="dark"] .bar-pain     { background: #c98383; } body[data-theme="light"] .bar-pain     { background: #cf9494; }
        body[data-theme="dark"] .bar-target   { background: #7fa2d4; } body[data-theme="light"] .bar-target   { background: #93b0d8; }
        .bar-solution { background: var(--accent); }
        body[data-theme="dark"] .bar-progress { background: #cfae76; } body[data-theme="light"] .bar-progress { background: #d5bb8b; }
    </style>
</head>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // ⚠️ 請填入你的 Supabase 連線資訊 ⚠️
        const SUPABASE_URL = "https://pbdgrwokkulcjsyoknhu.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBiZGdyd29ra3VsY2pzeW9rbmh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MzA2NDIsImV4cCI6MjEwMjMwNjY0Mn0.uDEfM8o5B81IjjG9dw1bUqNA7BRdlriPXhJe7EZYZOQ";

        const isConfigured = SUPABASE_URL && !SUPABASE_URL.includes("your-project-id");
        const supabase = isConfigured && window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        // 帳號格式：需同時包含英文字母與數字
        const ACCOUNT_REGEX = /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z0-9]+$/;
        // 密碼格式：固定 6 碼數字
        const PASSWORD_REGEX = /^\d{6}$/;

        // ===== 密碼雜湊（SHA-256 + 固定 salt；瀏覽器內建，不需額外套件）=====
        // 註：這比明文安全很多，但因是純前端固定 salt，並非最高等級。
        // 若日後要最嚴謹，應改用 Supabase Auth（伺服器端 bcrypt）。
        const PWD_SALT = "jj_ai_board::";
        const hashPassword = async (plain) => {
            try {
                const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(PWD_SALT + plain));
                return 'sha256$' + Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
            } catch (e) {
                return plain; // 極少數不支援的環境，退回明文（不致命）
            }
        };
        const isHashed = (v) => typeof v === 'string' && v.startsWith('sha256$');
        // 比對密碼：支援明文（舊資料）與雜湊（新資料）
        const verifyPassword = async (input, stored) => {
            if (stored == null) return false;
            if (isHashed(stored)) return (await hashPassword(input)) === stored;
            return input === stored; // 舊的明文密碼
        };

        // ===== 角色（三層）=====
        // BOSS 主管（最高）、ADMIN 管理員、MEMBER 一般成員
        const ROLE_LABEL = { BOSS: "BOSS", ADMIN: "ADMIN", MEMBER: "MEMBER" };
        const roleLabel = (r) => ROLE_LABEL[r] || "一般成員";
        const isBoss = (u) => u && u.role === "BOSS";
        const canAccessAccounts = (u) => u && (u.role === "BOSS" || u.role === "ADMIN"); // 能進帳號管理
        // 目前登入者(me)能否管理某個目標帳號(target)
        // 規則：主管(BOSS)可管理所有人；管理員(ADMIN)可管理 ADMIN 與 MEMBER，但不能動 BOSS
        const canManageAccount = (me, target) => {
            if (!me || !target) return false;
            if (me.role === "BOSS") return true;
            if (me.role === "ADMIN") return target.role !== "BOSS";
            return false;
        };

        // 登入狀態儲存 Key（localStorage 依「網域」各自獨立保存）
        const SESSION_KEY = "ai_dashboard_session";
        const THEME_KEY = "ai_dashboard_theme";
        // 閒置多久自動登出：4 小時
        const INACTIVITY_LIMIT_MS = 4 * 60 * 60 * 1000;

        const STATUS_LIST = ["開發測試中", "上線", "下線"];
        // 舊資料的 規劃/開發/測試 自動歸併顯示為「開發測試中」
        const normalizeStatus = (s) => (["規劃", "開發", "測試"].includes(s) ? "開發測試中" : (s || "開發測試中"));
        // 解析協作者欄位（JSON 陣列字串 → 名稱陣列）
        const parseCollab = (val) => {
            if (!val) return [];
            try {
                const arr = JSON.parse(val);
                return Array.isArray(arr) ? arr.filter(Boolean) : [];
            } catch (e) { return []; }
        };

        // 把「目前進展」拆成分列：優先用換行，若整段沒換行則用日期(如 8/16、2026/8/16)當分隔
        const splitProgress = (text) => {
            if (!text) return [];
            let raw = String(text).trim();
            if (/[\r\n]/.test(raw)) {
                return raw.split(/[\r\n]+/).map(s => s.trim()).filter(Boolean);
            }
            const parts = raw.split(/(?=(?:\d{4}\/)?\d{1,2}\/\d{1,2}[\s　])/).map(s => s.trim()).filter(Boolean);
            return parts.length > 0 ? parts : [raw];
        };
        const MAX_IMAGES = 3;
        const MAX_FILES = 3;          // 相關文件最多 3 個
        const MAX_FILE_MB = 20;       // 單一文件上限
        const MAX_VIDEO_MB = 50;      // 教學影片上限
        const STORAGE_BUCKET = "project-files";

        // 單位選項（含三班）
        const UNIT_OPTIONS = ["JJ-早", "JJ-中", "JJ-晚"];
        const getShift = (u) => {
            if (u.unit && u.unit.includes('-')) return u.unit.split('-')[1];
            return u.shift || '';
        };
        const getBaseUnit = (u) => {
            if (!u.unit) return 'JJ';
            return u.unit.split('-')[0];
        };

        // 解析 image_url：支援舊格式（單一字串）與新格式（JSON 陣列字串）
        const parseImages = (val) => {
            if (!val) return [];
            if (typeof val === 'string' && val.trim().startsWith('[')) {
                try {
                    const arr = JSON.parse(val);
                    return Array.isArray(arr) ? arr.filter(Boolean) : [];
                } catch (e) { return [val]; }
            }
            return [val];
        };

        // 解析 files 欄位：JSON 陣列 [{name, url}]
        const parseFiles = (val) => {
            if (!val) return [];
            try {
                const arr = JSON.parse(val);
                return Array.isArray(arr) ? arr.filter(x => x && x.url) : [];
            } catch (e) { return []; }
        };

        // 產生「強制下載」網址（Supabase Storage 支援 ?download=檔名，會以附件方式下載並保留原檔名）
        const downloadUrl = (url, name) => {
            if (!url) return url;
            return url + (url.includes('?') ? '&' : '?') + 'download=' + encodeURIComponent(name || '');
        };

        // ===== Session 讀寫（含最後活動時間，供閒置登出判斷）=====
        const readSession = () => {
            try {
                const raw = JSON.parse(localStorage.getItem(SESSION_KEY));
                if (!raw) return null;
                // 相容舊格式（直接存 user 物件）
                if (raw.account && !raw.user) return { user: raw, lastActive: Date.now() };
                if (raw.user && raw.user.account) return raw;
                return null;
            } catch (e) { return null; }
        };
        const writeSession = (user) => {
            try { localStorage.setItem(SESSION_KEY, JSON.stringify({ user, lastActive: Date.now() })); } catch (e) {}
        };
        const clearSession = () => {
            try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
        };

        function App() {
            const [currentTab, setCurrentTab] = useState("專案列表");
            const [projects, setProjects] = useState([]);

            // 深淺色主題
            const [theme, setTheme] = useState(() => {
                try { return localStorage.getItem(THEME_KEY) || 'dark'; } catch (e) { return 'dark'; }
            });
            useEffect(() => {
                document.body.setAttribute('data-theme', theme);
                try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
            }, [theme]);

            // 本地模擬模式下的預設帳號
            const [users, setUsers] = useState([
                { id: "1", name: "Admin", account: "admin01", password: "123456", role: "BOSS", unit: "JJ-早", shift: "早", status: "active" },
                { id: "2", name: "成員 A", account: "usera01", password: "111111", role: "MEMBER", unit: "JJ-中", shift: "中", status: "active" }
            ]);

            // ===== 登入狀態 =====
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [currentUser, setCurrentUser] = useState(null);
            const [loginForm, setLoginForm] = useState({ account: "", password: "" });
            const [loginError, setLoginError] = useState("");
            const [sessionNotice, setSessionNotice] = useState("");
            const [loggingIn, setLoggingIn] = useState(false);
            const [restoring, setRestoring] = useState(true);

            // Modal 控制
            const [showProjectModal, setShowProjectModal] = useState(false);
            const [showUserModal, setShowUserModal] = useState(false);
            const [submitting, setSubmitting] = useState(false);

            const [editingProjectId, setEditingProjectId] = useState(null);
            const [viewingProjectId, setViewingProjectId] = useState(null);
            const [lightboxUrl, setLightboxUrl] = useState(null);

            // 上傳中狀態
            const [uploadingFiles, setUploadingFiles] = useState(false);
            const [uploadingVideo, setUploadingVideo] = useState(false);

            // ===== 編輯成員帳號 Modal =====
            const [editUserTarget, setEditUserTarget] = useState(null);
            const [editUserForm, setEditUserForm] = useState({ name: "", role: "MEMBER", unit: "JJ-早", password: "" });
            const [editUserSaving, setEditUserSaving] = useState(false);

            // ===== 留言與更新紀錄 =====
            const [comments, setComments] = useState([]);
            const [newComment, setNewComment] = useState("");
            const [postingComment, setPostingComment] = useState(false);

            // ===== 搜尋 / 篩選 =====
            const [searchText, setSearchText] = useState("");
            const [filterStatus, setFilterStatus] = useState("全部");
            const [filterAuthor, setFilterAuthor] = useState("全部");
            const [filterType, setFilterType] = useState("全部");
            const [filterShift, setFilterShift] = useState("全部");

            // 單位成員頁：班別分頁（全部 / JJ-早 / JJ-中 / JJ-晚）
            const [memberShift, setMemberShift] = useState("全部");

            // 專案列表：排序方式 + 只看我的
            const [sortBy, setSortBy] = useState("最新");
            const [onlyMine, setOnlyMine] = useState(false);

            // 專案查看密碼：已解鎖的專案 id 清單、密碼輸入視窗
            const [unlockedIds, setUnlockedIds] = useState([]);
            const [pwPrompt, setPwPrompt] = useState(null); // { project }
            const [pwInput, setPwInput] = useState("");
            const [pwError, setPwError] = useState("");

            // 自助修改自己的密碼
            const [showMyPwModal, setShowMyPwModal] = useState(false);
            const [myPwForm, setMyPwForm] = useState({ oldPw: "", newPw: "", confirmPw: "" });
            const [myPwSaving, setMyPwSaving] = useState(false);
            const [myPwError, setMyPwError] = useState("");

            // 發布 / 編輯專案 Form
            const [newProject, setNewProject] = useState({
                title: "", type: "小工具", dept: "JJ", author: "", status: "開發測試中",
                link: "", images: [], files: [], video: "", collaborators: [], ai_tools: "",
                pain_point: "", target: "", solution: "", progress: "", view_password: ""
            });

            // 新增成員 Form
            const [newUser, setNewUser] = useState({
                name: "", account: "", password: "", email: "", role: "MEMBER", unit: "JJ-早", shift: "早"
            });

            // ===== 閒置自動登出 =====
            const lastTouchRef = useRef(Date.now());
            const lastWriteRef = useRef(0);

            const forceLogout = (notice) => {
                setIsLoggedIn(false);
                setCurrentUser(null);
                setLoginForm({ account: "", password: "" });
                setLoginError("");
                setCurrentTab("專案列表");
                setViewingProjectId(null);
                clearSession();
                if (notice) setSessionNotice(notice);
            };

            useEffect(() => {
                if (!isLoggedIn) return;
                lastTouchRef.current = Date.now();

                const touch = () => {
                    const now = Date.now();
                    lastTouchRef.current = now;
                    // 節流：最多每 60 秒寫入一次 localStorage
                    if (now - lastWriteRef.current > 60 * 1000) {
                        lastWriteRef.current = now;
                        try {
                            const s = readSession();
                            if (s) {
                                s.lastActive = now;
                                localStorage.setItem(SESSION_KEY, JSON.stringify(s));
                            }
                        } catch (e) {}
                    }
                };
                const check = () => {
                    let last = lastTouchRef.current;
                    const s = readSession();
                    if (s && s.lastActive) last = Math.max(last, s.lastActive);
                    if (Date.now() - last > INACTIVITY_LIMIT_MS) {
                        forceLogout("閒置超過 4 小時，為了安全已自動登出，請重新登入");
                    }
                };
                const events = ['click', 'keydown', 'scroll', 'touchstart'];
                events.forEach(ev => window.addEventListener(ev, touch, { passive: true }));
                const timer = setInterval(check, 60 * 1000);
                return () => {
                    events.forEach(ev => window.removeEventListener(ev, touch));
                    clearInterval(timer);
                };
            }, [isLoggedIn]);

            // ===== 初始化：還原登入狀態 + 讀取資料 =====
            useEffect(() => {
                const init = async () => {
                    try {
                        const saved = readSession();
                        if (saved && saved.user && saved.user.account) {
                            // 閒置超過 4 小時 → 不還原，要求重新登入
                            if (saved.lastActive && Date.now() - saved.lastActive > INACTIVITY_LIMIT_MS) {
                                clearSession();
                                setSessionNotice("閒置超過 4 小時，為了安全已自動登出，請重新登入");
                            } else if (supabase) {
                                const { data } = await supabase
                                    .from('profiles')
                                    .select('*')
                                    .eq('account', saved.user.account)
                                    .maybeSingle();
                                if (data && data.status !== 'disabled') {
                                    const userObj = { id: data.id, name: data.name, role: data.role, account: data.account };
                                    setCurrentUser(userObj);
                                    setIsLoggedIn(true);
                                    writeSession(userObj);
                                } else {
                                    clearSession();
                                }
                            } else {
                                setCurrentUser(saved.user);
                                setIsLoggedIn(true);
                                writeSession(saved.user);
                            }
                        }
                    } catch (e) {
                        console.error("還原登入狀態失敗：", e);
                    } finally {
                        setRestoring(false);
                    }
                    fetchData();
                };
                init();
            }, []);

            // ESC 關閉燈箱
            useEffect(() => {
                const onKey = (e) => { if (e.key === "Escape") setLightboxUrl(null); };
                window.addEventListener("keydown", onKey);
                return () => window.removeEventListener("keydown", onKey);
            }, []);

            const fetchData = async () => {
                if (supabase) {
                    try {
                        const { data: projData } = await supabase.from('projects').select('*').order('id', { ascending: false });
                        const { data: userData } = await supabase.from('profiles').select('*');
                        if (projData) setProjects(projData);
                        if (userData && userData.length > 0) setUsers(userData);
                        const { data: commentData } = await supabase.from('comments').select('*').order('id', { ascending: true });
                        if (commentData) setComments(commentData);
                    } catch (err) {
                        console.error("讀取失敗：", err);
                    }
                }
            };

            // ===== 登入 =====
            const handleLogin = async (e) => {
                e.preventDefault();
                setLoginError("");
                setSessionNotice("");
                const account = loginForm.account.trim();
                const password = loginForm.password.trim();
                if (!account || !password) {
                    setLoginError("請輸入帳號與密碼");
                    return;
                }

                setLoggingIn(true);
                try {
                    let userObj = null;
                    if (supabase) {
                        const { data, error } = await supabase
                            .from('profiles')
                            .select('*')
                            .eq('account', account)
                            .maybeSingle();

                        if (error || !data || !(await verifyPassword(password, data.password))) {
                            setLoginError("帳號或密碼錯誤");
                        } else if (data.status === 'disabled') {
                            setLoginError("此帳號已被停用，請聯絡管理員");
                        } else {
                            userObj = { id: data.id, name: data.name, role: data.role, account: data.account };
                            // 自動升級：若資料庫仍是明文密碼，登入成功後轉存為雜湊
                            if (!isHashed(data.password)) {
                                try {
                                    const hashed = await hashPassword(password);
                                    await supabase.from('profiles').update({ password: hashed }).eq('id', data.id);
                                } catch (e) { /* 升級失敗不影響登入 */ }
                            }
                        }
                    } else {
                        const matched = users.find(u => u.account === account);
                        if (!matched || !(await verifyPassword(password, matched.password))) {
                            setLoginError("帳號或密碼錯誤（本地模擬模式）");
                        } else if (matched.status === 'disabled') {
                            setLoginError("此帳號已被停用，請聯絡管理員");
                        } else {
                            userObj = { id: matched.id, name: matched.name, role: matched.role, account: matched.account };
                        }
                    }

                    if (userObj) {
                        setCurrentUser(userObj);
                        setIsLoggedIn(true);
                        setCurrentTab("總覽");
                        writeSession(userObj);
                    }
                } catch (err) {
                    setLoginError("登入時發生錯誤，請稍後再試");
                } finally {
                    setLoggingIn(false);
                }
            };

            const handleLogout = () => {
                if (confirm("確定要登出系統嗎？")) forceLogout("");
            };

            // 自助修改自己的密碼
            const handleChangeMyPassword = async (e) => {
                e.preventDefault();
                setMyPwError("");
                const { oldPw, newPw, confirmPw } = myPwForm;
                if (!oldPw || !newPw || !confirmPw) { setMyPwError("請完整填寫三個欄位"); return; }
                if (!PASSWORD_REGEX.test(newPw)) { setMyPwError("新密碼需為 6 位數字"); return; }
                if (newPw !== confirmPw) { setMyPwError("兩次輸入的新密碼不一致"); return; }

                setMyPwSaving(true);
                try {
                    if (supabase) {
                        // 先向資料庫確認舊密碼正確
                        const { data, error } = await supabase.from('profiles').select('*').eq('id', currentUser.id).maybeSingle();
                        if (error || !data) { setMyPwError("讀取帳號失敗，請稍後再試"); setMyPwSaving(false); return; }
                        if (!(await verifyPassword(oldPw, data.password))) { setMyPwError("目前密碼不正確"); setMyPwSaving(false); return; }
                        const hashed = await hashPassword(newPw);
                        const { error: upErr } = await supabase.from('profiles').update({ password: hashed }).eq('id', currentUser.id);
                        if (upErr) { setMyPwError("更新失敗：" + upErr.message); setMyPwSaving(false); return; }
                        setUsers(users.map(u => u.id === currentUser.id ? { ...u, password: hashed } : u));
                    } else {
                        const me = users.find(u => u.id === currentUser.id);
                        if (!me || !(await verifyPassword(oldPw, me.password))) { setMyPwError("目前密碼不正確"); setMyPwSaving(false); return; }
                        setUsers(users.map(u => u.id === currentUser.id ? { ...u, password: newPw } : u));
                    }
                    setShowMyPwModal(false);
                    setMyPwForm({ oldPw: "", newPw: "", confirmPw: "" });
                    alert("✅ 密碼已更新，下次登入請用新密碼");
                } catch (err) {
                    setMyPwError("發生錯誤，請稍後再試");
                } finally {
                    setMyPwSaving(false);
                }
            };

            // 專案編輯／刪除權限：發布者本人，或列名的共同研究成員（管理員也不能改別人的專案）
            const canManageProject = (item) => {
                if (!currentUser) return false;
                if (item.author === currentUser.name) return true;
                return parseCollab(item.collaborators).includes(currentUser.name);
            };

            // ⚡ 圖片自動等比例壓縮 (最高 800px，品質 70%)
            const compressImage = (file) => new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onerror = () => reject(new Error("讀取圖片失敗"));
                reader.onload = (event) => {
                    const img = new Image();
                    img.onerror = () => reject(new Error("圖片格式不支援"));
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const maxDim = 800;
                        if (width > maxDim || height > maxDim) {
                            if (width > height) {
                                height = Math.round((height * maxDim) / width);
                                width = maxDim;
                            } else {
                                width = Math.round((width * maxDim) / height);
                                height = maxDim;
                            }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });

            // 上傳 1~3 張圖片
            const handleImageUpload = async (e) => {
                const files = Array.from(e.target.files || []);
                e.target.value = "";
                if (!files.length) return;

                const remaining = MAX_IMAGES - newProject.images.length;
                if (remaining <= 0) {
                    alert(`最多只能上傳 ${MAX_IMAGES} 張圖片，請先刪除不要的圖片`);
                    return;
                }
                if (files.length > remaining) alert(`最多 ${MAX_IMAGES} 張，將只加入前 ${remaining} 張`);

                try {
                    const toProcess = files.slice(0, remaining);
                    const results = [];
                    for (const f of toProcess) results.push(await compressImage(f));
                    setNewProject(prev => ({ ...prev, images: [...prev.images, ...results].slice(0, MAX_IMAGES) }));
                } catch (err) {
                    alert("圖片處理失敗：" + err.message);
                }
            };
            const handleRemoveImage = (idx) => {
                setNewProject(prev => ({ ...prev, images: prev.images.filter((_, i) => i !== idx) }));
            };

            // 上傳檔案到 Supabase Storage，回傳公開網址
            const uploadToStorage = async (file, folder) => {
                const ext = (file.name.split('.').pop() || 'bin').toLowerCase();
                const path = `${folder}/${Date.now()}_${Math.random().toString(36).slice(2, 8)}.${ext}`;
                const { error } = await supabase.storage.from(STORAGE_BUCKET).upload(path, file);
                if (error) throw error;
                const { data } = supabase.storage.from(STORAGE_BUCKET).getPublicUrl(path);
                return data.publicUrl;
            };

            // 📎 上傳相關文件（txt/pdf/office 等，最多 3 個）
            const handleDocUpload = async (e) => {
                const files = Array.from(e.target.files || []);
                e.target.value = "";
                if (!files.length) return;

                const remaining = MAX_FILES - newProject.files.length;
                if (remaining <= 0) {
                    alert(`最多只能上傳 ${MAX_FILES} 個文件，請先刪除不要的`);
                    return;
                }
                const toProcess = files.slice(0, remaining);
                if (files.length > remaining) alert(`最多 ${MAX_FILES} 個文件，將只加入前 ${remaining} 個`);

                setUploadingFiles(true);
                try {
                    const added = [];
                    for (const f of toProcess) {
                        if (f.size > MAX_FILE_MB * 1024 * 1024) {
                            alert(`「${f.name}」超過 ${MAX_FILE_MB}MB，已略過`);
                            continue;
                        }
                        const url = supabase ? await uploadToStorage(f, 'docs') : URL.createObjectURL(f);
                        added.push({ name: f.name, url });
                    }
                    if (added.length) {
                        setNewProject(prev => ({ ...prev, files: [...prev.files, ...added].slice(0, MAX_FILES) }));
                    }
                } catch (err) {
                    alert("文件上傳失敗：" + err.message + "\n\n（若錯誤與 bucket 或權限有關，請先到 Supabase 建立 " + STORAGE_BUCKET + " 儲存空間並設定政策）");
                } finally {
                    setUploadingFiles(false);
                }
            };
            const handleRemoveFile = (idx) => {
                setNewProject(prev => ({ ...prev, files: prev.files.filter((_, i) => i !== idx) }));
            };

            // 🎬 上傳操作教學影片（1 部）
            const handleVideoUpload = async (e) => {
                const file = (e.target.files || [])[0];
                e.target.value = "";
                if (!file) return;
                if (!file.type.startsWith('video/')) {
                    alert("請上傳影片檔（mp4 / webm 等格式）");
                    return;
                }
                if (file.size > MAX_VIDEO_MB * 1024 * 1024) {
                    alert(`影片超過 ${MAX_VIDEO_MB}MB 上限，請先壓縮或剪輯後再上傳`);
                    return;
                }

                setUploadingVideo(true);
                try {
                    const url = supabase ? await uploadToStorage(file, 'videos') : URL.createObjectURL(file);
                    setNewProject(prev => ({ ...prev, video: url }));
                } catch (err) {
                    alert("影片上傳失敗：" + err.message + "\n\n（若錯誤與 bucket 或權限有關，請先到 Supabase 建立 " + STORAGE_BUCKET + " 儲存空間並設定政策）");
                } finally {
                    setUploadingVideo(false);
                }
            };
            const handleRemoveVideo = () => {
                setNewProject(prev => ({ ...prev, video: "" }));
            };

            // 開啟「編輯專案」彈窗
            const handleOpenEditProject = (item) => {
                if (!canManageProject(item)) {
                    alert("僅發布者本人可編輯此專案");
                    return;
                }
                setNewProject({
                    title: item.title || "",
                    type: item.type || "小工具",
                    dept: item.dept || "JJ",
                    author: item.author || "",
                    status: normalizeStatus(item.status),
                    link: item.link || "",
                    images: parseImages(item.image_url),
                    files: parseFiles(item.files),
                    video: item.video_url || "",
                    collaborators: parseCollab(item.collaborators),
                    ai_tools: item.ai_tools || "",
                    pain_point: item.pain_point || "",
                    target: item.target || "",
                    solution: item.solution || "",
                    progress: item.progress || "",
                    view_password: item.view_password || ""
                });
                setEditingProjectId(item.id);
                setShowProjectModal(true);
            };

            const handleCloseProjectModal = () => {
                setShowProjectModal(false);
                setEditingProjectId(null);
                resetProjectForm();
            };

            // 表單 → 資料庫欄位
            const buildProjectPayload = (form) => {
                const { images, files, video, collaborators, ...rest } = form;
                const finalAuthor = rest.author || (currentUser ? currentUser.name : "");
                const collab = (collaborators || []).filter(n => n && n !== finalAuthor);
                return {
                    ...rest,
                    image_url: images && images.length > 0 ? JSON.stringify(images) : "",
                    files: files && files.length > 0 ? JSON.stringify(files) : "",
                    video_url: video || "",
                    collaborators: collab.length > 0 ? JSON.stringify(collab) : ""
                };
            };

            // 發布 或 更新 專案
            const handleAddProject = async (e) => {
                e.preventDefault();
                if (!newProject.title) return alert("請輸入專案名稱");
                if (uploadingFiles || uploadingVideo) return alert("檔案上傳中，請稍候再送出");

                setSubmitting(true);
                try {
                    if (editingProjectId) {
                        const original = projects.find(p => p.id === editingProjectId);
                        if (original && !canManageProject(original)) {
                            alert("僅發布者本人可編輯此專案");
                            setSubmitting(false);
                            return;
                        }

                        const updates = {
                            ...buildProjectPayload(newProject),
                            launch_date: newProject.status === "上線"
                                ? (original && original.launch_date && original.launch_date !== "-" ? original.launch_date : new Date().toLocaleDateString())
                                : "-"
                        };

                        if (supabase) {
                            const { data, error } = await supabase.from('projects').update(updates).eq('id', editingProjectId).select();
                            if (error) {
                                alert("更新失敗：" + error.message + "\n\n（若錯誤為找不到 files / video_url / progress 欄位，請先到 Supabase 為 projects 表補上欄位）");
                            } else {
                                setProjects(projects.map(p => p.id === editingProjectId ? { ...p, ...updates } : p));
                                if (original && normalizeStatus(original.status) !== newProject.status) {
                                    insertComment(editingProjectId, `狀態由「${normalizeStatus(original.status)}」變更為「${newProject.status}」`, 'system').catch(() => {});
                                }
                                handleCloseProjectModal();
                                alert("✅ 已更新專案");
                            }
                        } else {
                            setProjects(projects.map(p => p.id === editingProjectId ? { ...p, ...updates } : p));
                            if (original && normalizeStatus(original.status) !== newProject.status) {
                                insertComment(editingProjectId, `狀態由「${normalizeStatus(original.status)}」變更為「${newProject.status}」`, 'system').catch(() => {});
                            }
                            handleCloseProjectModal();
                            alert("✅ (本地模擬) 已更新專案");
                        }
                    } else {
                        const item = {
                            ...buildProjectPayload(newProject),
                            author: newProject.author || currentUser.name,
                            start_date: new Date().toLocaleDateString(),
                            launch_date: newProject.status === "上線" ? new Date().toLocaleDateString() : "-"
                        };

                        if (supabase) {
                            const { data, error } = await supabase.from('projects').insert([item]).select();
                            if (error) {
                                alert("發布失敗，請查看 Supabase 欄位是否齊全：" + error.message);
                            } else if (data) {
                                setProjects([data[0], ...projects]);
                                handleCloseProjectModal();
                                alert("🎉 發布成功！");
                            }
                        } else {
                            setProjects([{ id: Date.now(), ...item }, ...projects]);
                            handleCloseProjectModal();
                            alert("🎉 (本地模擬) 發布成功！");
                        }
                    }
                } catch (err) {
                    alert("連線發送失敗，請確認 Supabase 網址與 Key 是否正確！\n" + err.message);
                } finally {
                    setSubmitting(false);
                }
            };

            // 從公開網址反推 Storage 內的檔案路徑（供刪除用）
            const storagePathFromUrl = (url) => {
                const marker = `/${STORAGE_BUCKET}/`;
                const i = url.indexOf(marker);
                return i >= 0 ? decodeURIComponent(url.slice(i + marker.length)) : null;
            };

            // 刪除專案（僅發布者本人）
            const handleDeleteProject = async (item) => {
                if (!canManageProject(item)) {
                    alert("僅發布者本人可刪除此專案");
                    return;
                }
                if (!confirm(`確定要刪除專案「${item.title}」嗎？此動作無法復原。`)) return;

                try {
                    if (supabase) {
                        const { error } = await supabase.from('projects').delete().eq('id', item.id);
                        if (error) {
                            alert("刪除失敗：" + error.message);
                            return;
                        }
                        // 一併刪除留言與 Storage 上的附件（失敗不影響主要流程）
                        try { await supabase.from('comments').delete().eq('project_id', item.id); } catch (e) {}
                        try {
                            const urls = [...parseFiles(item.files).map(f => f.url), item.video_url].filter(Boolean);
                            const paths = urls.map(storagePathFromUrl).filter(Boolean);
                            if (paths.length) await supabase.storage.from(STORAGE_BUCKET).remove(paths);
                        } catch (e) {}
                    }
                    setProjects(projects.filter(p => p.id !== item.id));
                    setComments(prev => prev.filter(c => c.project_id !== item.id));
                    if (viewingProjectId === item.id) setViewingProjectId(null);
                } catch (err) {
                    alert("刪除失敗，請確認連線是否正常！\n" + err.message);

            // 依成員名稱取得其所屬單位（找不到則回傳第一個選項）
            const unitOfMember = (name) => {
                const u = users.find(x => x.name === name);
                return u && UNIT_OPTIONS.includes(u.unit) ? u.unit : UNIT_OPTIONS[0];
            };

            // 快速切換專案狀態（詳情頁一鍵操作，僅本人；會自動寫入系統紀錄）
            const handleQuickStatusChange = async (item, newStatus) => {
                if (!canManageProject(item) || normalizeStatus(item.status) === newStatus) return;
                const updates = {
                    status: newStatus,
                    launch_date: newStatus === "上線"
                        ? (item.launch_date && item.launch_date !== "-" ? item.launch_date : new Date().toLocaleDateString())
                        : "-"
                };
                try {
                    if (supabase) {
                        const { error } = await supabase.from('projects').update(updates).eq('id', item.id);
                        if (error) { alert("狀態更新失敗：" + error.message); return; }
                    }
                    setProjects(prev => prev.map(p => p.id === item.id ? { ...p, ...updates } : p));
                    insertComment(item.id, `狀態由「${normalizeStatus(item.status)}」變更為「${newStatus}」`, 'system').catch(() => {});
                } catch (err) {
                    alert("狀態更新失敗：" + err.message);
                }
            };

            const resetProjectForm = () => {
                setNewProject({
                    title: "", type: "小工具", dept: "JJ", author: "", status: "開發測試中",
                    link: "", images: [], files: [], video: "", collaborators: [], ai_tools: "",
                    pain_point: "", target: "", solution: "", progress: "", view_password: ""
                });
            };

            const DEFAULT_PASSWORD = "123456";

            // 新增成員帳號（BOSS / ADMIN）
            const handleAddUser = async (e) => {
                e.preventDefault();
                if (!canAccessAccounts(currentUser)) return alert("僅主管或管理員可新增成員帳號");
                if (!newUser.name || !newUser.account) {
                    return alert("請填寫暱稱與帳號");
                }
                if (!ACCOUNT_REGEX.test(newUser.account)) {
                    return alert("帳號格式錯誤：需為英文字母＋數字組合（例如 user01）");
                }
                if (users.some(u => u.account === newUser.account)) {
                    return alert("此帳號已被使用，請更換其他帳號");
                }

                const shift = newUser.unit.includes('-') ? newUser.unit.split('-')[1] : '早';

                if (supabase) {
                    const hashed = await hashPassword(DEFAULT_PASSWORD);
                    const userItem = { ...newUser, password: hashed, shift, status: 'active' };
                    const { data, error } = await supabase.from('profiles').insert([userItem]).select();
                    if (error) {
                        alert("新增失敗：" + error.message);
                    } else if (data) {
                        setUsers([...users, data[0]]);
                        setShowUserModal(false);
                        setNewUser({ name: "", account: "", password: "", email: "", role: "MEMBER", unit: "JJ-早", shift: "早" });
                        alert(`🎉 成員帳號新增成功！\n預設密碼為 ${DEFAULT_PASSWORD}，請提醒對方登入後自行修改。`);
                    }
                } else {
                    const userItem = { ...newUser, password: DEFAULT_PASSWORD, shift, status: 'active' };
                    setUsers([...users, { id: String(users.length + 1), ...userItem }]);
                    setShowUserModal(false);
                    setNewUser({ name: "", account: "", password: "", email: "", role: "MEMBER", unit: "JJ-早", shift: "早" });
                    alert(`🎉 (本地模擬) 成員帳號新增成功！預設密碼 ${DEFAULT_PASSWORD}`);
                }
            };

            // 停用 / 啟用
            const handleToggleUserStatus = async (u) => {
                if (!canManageAccount(currentUser, u)) return alert("您沒有權限管理此帳號");
                if (u.account === currentUser.account) return alert("不能停用自己的帳號");

                const isDisabled = u.status === 'disabled';
                const nextStatus = isDisabled ? 'active' : 'disabled';
                const actionText = isDisabled ? '啟用' : '停用';
                if (!confirm(`確定要${actionText}帳號「${u.name}（${u.account}）」嗎？`)) return;

                try {
                    if (supabase) {
                        const { error } = await supabase.from('profiles').update({ status: nextStatus }).eq('id', u.id);
                        if (error) {
                            alert(`${actionText}失敗：` + error.message);
                            return;
                        }
                    }
                    setUsers(users.map(x => x.id === u.id ? { ...x, status: nextStatus } : x));
                    alert(`✅ 已${actionText}帳號「${u.name}」`);
                } catch (err) {
                    alert(`${actionText}失敗，請確認連線是否正常！\n` + err.message);
                }
            };

            // 開啟編輯成員彈窗
            const handleOpenEditUser = (u) => {
                if (!canManageAccount(currentUser, u)) return alert("您沒有權限編輯此帳號");
                setEditUserTarget(u);
                setEditUserForm({
                    name: u.name || "",
                    role: u.role || "MEMBER",
                    unit: UNIT_OPTIONS.includes(u.unit) ? u.unit : "JJ-早",
                    password: ""
                });
            };

            // 儲存成員編輯
            const handleSaveEditUser = async (e) => {
                e.preventDefault();
                if (!editUserTarget) return;
                if (!canManageAccount(currentUser, editUserTarget)) return alert("您沒有權限編輯此帳號");

                const newName = editUserForm.name.trim();
                if (!newName) return alert("暱稱不可為空");
                if (editUserForm.password && !PASSWORD_REGEX.test(editUserForm.password)) {
                    return alert("密碼格式錯誤：需為 6 位數字（留空則不變更）");
                }
                // 管理員不能指派 BOSS（只有 BOSS 能指派 BOSS）
                if (currentUser.role === "ADMIN" && editUserForm.role === "BOSS") {
                    return alert("只有 BOSS 能指派 BOSS 權限");
                }
                // 主管不能把自己降級（避免系統失去唯一主管而無法管理）
                if (isBoss(currentUser) && editUserTarget.account === currentUser.account && editUserForm.role !== "BOSS") {
                    if (!users.some(u => u.role === "BOSS" && u.account !== currentUser.account)) {
                        return alert("目前只有您一位主管，請先指派另一位主管，才能變更自己的角色");
                    }
                }

                const shift = editUserForm.unit.includes('-') ? editUserForm.unit.split('-')[1] : '早';
                const updates = { name: newName, role: editUserForm.role, unit: editUserForm.unit, shift };
                if (editUserForm.password) {
                    updates.password = supabase ? await hashPassword(editUserForm.password) : editUserForm.password;
                }

                const oldName = editUserTarget.name;
                const nameChanged = oldName !== newName;

                setEditUserSaving(true);
                try {
                    if (supabase) {
                        const { error } = await supabase.from('profiles').update(updates).eq('id', editUserTarget.id);
                        if (error) {
                            alert("儲存失敗：" + error.message);
                            setEditUserSaving(false);
                            return;
                        }
                        if (nameChanged) {
                            const { error: projErr } = await supabase.from('projects').update({ author: newName }).eq('author', oldName);
                            if (projErr) console.error("同步專案負責人失敗：", projErr);
                        }
                    }
                    setUsers(users.map(x => x.id === editUserTarget.id ? { ...x, ...updates } : x));
                    if (nameChanged) {
                        setProjects(projects.map(p => p.author === oldName ? { ...p, author: newName } : p));
                        if (editUserTarget.account === currentUser.account) {
                            const updatedSelf = { ...currentUser, name: newName };
                            setCurrentUser(updatedSelf);
                            writeSession(updatedSelf);
                        }
                    }
                    setEditUserTarget(null);
                    alert("✅ 已儲存成員資料");
                } catch (err) {
                    alert("儲存失敗，請確認連線是否正常！\n" + err.message);
                } finally {
                    setEditUserSaving(false);
                }
            };

            // 刪除成員帳號
            const handleDeleteUser = async (u) => {
                if (!canManageAccount(currentUser, u)) return alert("您沒有權限刪除此帳號");
                if (u.account === currentUser.account) return alert("不能刪除自己的帳號");
                if (projects.some(p => p.author === u.name)) {
                    return alert(`「${u.name}」仍是某些專案的負責人，無法刪除。\n請先請本人處理其專案（可改用「停用」）。`);
                }
                if (!confirm(`確定要刪除帳號「${u.name}（${u.account}）」嗎？此動作無法復原。`)) return;

                try {
                    if (supabase) {
                        const { error } = await supabase.from('profiles').delete().eq('id', u.id);
                        if (error) {
                            alert("刪除失敗：" + error.message);
                            return;
                        }
                    }
                    setUsers(users.filter(x => x.id !== u.id));
                    setEditUserTarget(null);
                    alert(`✅ 已刪除帳號「${u.name}」`);
                } catch (err) {
                    alert("刪除失敗，請確認連線是否正常！\n" + err.message);
                }
            };

            // ===== 留言與更新紀錄 =====
            const insertComment = async (projectId, content, kind) => {
                const item = {
                    project_id: projectId,
                    author: currentUser ? currentUser.name : "",
                    content,
                    kind,
                    created_at: new Date().toISOString()
                };
                if (supabase) {
                    const { data, error } = await supabase.from('comments').insert([item]).select();
                    if (error) throw error;
                    if (data) setComments(prev => [...prev, data[0]]);
                } else {
                    setComments(prev => [...prev, { id: Date.now(), ...item }]);
                }
            };

            const handlePostComment = async () => {
                const content = newComment.trim();
                if (!content || !viewingProject) return;
                setPostingComment(true);
                try {
                    await insertComment(viewingProject.id, content, 'comment');
                    setNewComment("");
                } catch (err) {
                    alert("留言失敗：" + err.message);
                } finally {
                    setPostingComment(false);
                }
            };

            const canDeleteComment = (c) => {
                if (!currentUser) return false;
                return c.author === currentUser.name || canAccessAccounts(currentUser);
            };

            const handleDeleteComment = async (c) => {
                if (!canDeleteComment(c)) return;
                if (!confirm("確定要刪除這則紀錄嗎？")) return;
                try {
                    if (supabase) {
                        const { error } = await supabase.from('comments').delete().eq('id', c.id);
                        if (error) { alert("刪除失敗：" + error.message); return; }
                    }
                    setComments(prev => prev.filter(x => x.id !== c.id));
                } catch (err) {
                    alert("刪除失敗：" + err.message);
                }
            };

            const formatTime = (t) => {
                if (!t) return "";
                try { return new Date(t).toLocaleString('zh-TW', { hour12: false }); } catch (e) { return String(t); }
            };

            // ===== 專案搜尋 / 篩選 / 排序 =====
            const filteredProjects = useMemo(() => {
                const kw = searchText.trim().toLowerCase();
                const myName = currentUser ? currentUser.name : "";
                let list = projects.filter(p => {
                    if (onlyMine && !(p.author === myName || parseCollab(p.collaborators).includes(myName))) return false;
                    if (filterStatus !== "全部" && normalizeStatus(p.status) !== filterStatus) return false;
                    if (filterAuthor !== "全部" && p.author !== filterAuthor) return false;
                    if (filterType !== "全部" && p.type !== filterType) return false;
                    if (filterShift !== "全部") {
                        const au = users.find(u => u.name === p.author);
                        const shiftUnit = au ? (UNIT_OPTIONS.includes(au.unit) ? au.unit : `${getBaseUnit(au)}-${getShift(au) || '早'}`) : "";
                        if (shiftUnit !== filterShift) return false;
                    }
                    if (kw) {
                        const hay = [p.title, p.author, p.dept, p.pain_point, p.target, p.solution, p.progress, p.ai_tools]
                            .filter(Boolean).join(" ").toLowerCase();
                        if (!hay.includes(kw)) return false;
                    }
                    return true;
                });
                const commentCount = (id) => comments.filter(c => c.project_id === id).length;
                const statusOrder = { "開發測試中": 0, "上線": 1, "下線": 2 };
                list = [...list].sort((a, b) => {
                    if (sortBy === "最舊") return (a.id > b.id ? 1 : -1);
                    if (sortBy === "最多留言") return commentCount(b.id) - commentCount(a.id);
                    if (sortBy === "依狀態") return statusOrder[normalizeStatus(a.status)] - statusOrder[normalizeStatus(b.status)] || (b.id > a.id ? 1 : -1);
                    if (sortBy === "名稱") return String(a.title).localeCompare(String(b.title), 'zh-Hant');
                    return (b.id > a.id ? 1 : -1); // 最新（預設）
                });
                return list;
            }, [projects, comments, searchText, filterStatus, filterAuthor, filterType, filterShift, sortBy, onlyMine, currentUser, users]);

            const hasActiveFilter = searchText.trim() !== "" || filterStatus !== "全部" || filterAuthor !== "全部" || filterType !== "全部" || filterShift !== "全部" || onlyMine || sortBy !== "最新";
            const clearFilters = () => { setSearchText(""); setFilterStatus("全部"); setFilterAuthor("全部"); setFilterType("全部"); setFilterShift("全部"); setOnlyMine(false); setSortBy("最新"); };

            // ===== 單位成員統計 =====
            const memberStats = useMemo(() => {
                const list = users.filter(u => u.role !== "BOSS").map(u => {
                    // 含本人發布 + 列名協作的專案
                    const ps = projects.filter(p => p.author === u.name || parseCollab(p.collaborators).includes(u.name));
                    const counts = {};
                    STATUS_LIST.forEach(s => counts[s] = ps.filter(p => normalizeStatus(p.status) === s).length);
                    return { user: u, projects: ps, counts, total: ps.length };
                }).sort((a, b) => (b.counts["上線"] - a.counts["上線"]) || (b.total - a.total));
                return list.map((m, i) => ({ ...m, rank: i + 1 }));
            }, [users, projects]);

            const unitGroups = useMemo(() => {
                const groups = {};
                memberStats.forEach(m => {
                    const unit = UNIT_OPTIONS.includes(m.user.unit) ? m.user.unit : `${getBaseUnit(m.user)}-${getShift(m.user) || '早'}`;
                    if (!groups[unit]) groups[unit] = [];
                    groups[unit].push(m);
                });
                return groups;
            }, [memberStats]);

            const viewingProject = viewingProjectId != null
                ? projects.find(p => p.id === viewingProjectId)
                : null;

            // 是否能免密碼查看：僅限發布者本人與共同研究成員（連 BOSS／ADMIN 也要輸入密碼）
            const canViewWithoutPassword = (item) => {
                if (!currentUser) return false;
                if (item.author === currentUser.name) return true;
                return parseCollab(item.collaborators).includes(currentUser.name);
            };

            const openProjectDetail = (item) => {
                // 有設查看密碼、且非可免密碼者、且尚未解鎖 → 先跳密碼視窗
                if (item.view_password && !canViewWithoutPassword(item) && !unlockedIds.includes(item.id)) {
                    setPwPrompt({ project: item });
                    setPwInput("");
                    setPwError("");
                    return;
                }
                setViewingProjectId(item.id);
                setCurrentTab("專案列表");
                window.scrollTo(0, 0);
            };

            // 送出查看密碼
            const submitViewPassword = (e) => {
                if (e) e.preventDefault();
                if (!pwPrompt) return;
                if (pwInput === pwPrompt.project.view_password) {
                    setUnlockedIds(prev => [...prev, pwPrompt.project.id]);
                    setViewingProjectId(pwPrompt.project.id);
                    setCurrentTab("專案列表");
                    setPwPrompt(null);
                    setPwInput("");
                    setPwError("");
                    window.scrollTo(0, 0);
                } else {
                    setPwError("密碼錯誤，請再試一次");
                }
            };

            // 深淺色切換按鈕
            const ThemeToggle = () => (
                <button
                    type="button"
                    onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')}
                    className="btn-ghost px-3 py-1.5 rounded-full text-xs font-semibold"
                    title="切換深／淺色模式"
                >
                    {theme === 'dark' ? '🌙 深色' : '☀️ 淺色'}
                </button>
            );

            // ===== 還原登入狀態中 =====
            if (restoring) {
                return (
                    <div className="min-h-screen flex items-center justify-center">
                        <div className="text-center">
                            <span className="font-black text-xl logo px-3 py-1.5 rounded inline-block">AI 成果</span>
                            <p className="t3 text-sm mt-4">載入中...</p>
                        </div>
                    </div>
                );
            }

            // ===== 登入畫面 =====
            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 relative">
                        <div className="absolute top-4 right-4"><ThemeToggle /></div>
                        <div className="w-full max-w-sm">
                            <div className="text-center mb-6">
                                <span className="font-black text-xl logo px-3 py-1.5 rounded inline-block">AI 成果</span>
                                <p className="t2 text-sm mt-3">請登入以管理專案與成員</p>
                            </div>
                            {sessionNotice && (
                                <p className="text-xs t2 app-panel rounded-lg px-3 py-2 mb-3 text-center">⏰ {sessionNotice}</p>
                            )}
                            <form onSubmit={handleLogin} className="app-card rounded-2xl p-6 space-y-4">
                                <div>
                                    <label className="text-xs t3 block mb-1">帳號</label>
                                    <input
                                        type="text"
                                        required
                                        autoFocus
                                        className="w-full p-2.5 rounded-lg app-input text-sm"
                                        value={loginForm.account}
                                        onChange={e => setLoginForm({ ...loginForm, account: e.target.value })}
                                        placeholder="例如：user01"
                                    />
                                </div>
                                <div>
                                    <label className="text-xs t3 block mb-1">密碼</label>
                                    <input
                                        type="password"
                                        required
                                        inputMode="numeric"
                                        maxLength="6"
                                        className="w-full p-2.5 rounded-lg app-input text-sm"
                                        value={loginForm.password}
                                        onChange={e => setLoginForm({ ...loginForm, password: e.target.value.replace(/\D/g, '').slice(0, 6) })}
                                        placeholder="6 位數字"
                                    />
                                </div>
                                {loginError && (
                                    <p className="text-xs danger app-panel rounded-lg px-3 py-2">{loginError}</p>
                                )}
                                <button
                                    type="submit"
                                    disabled={loggingIn}
                                    className="w-full py-2.5 btn-accent font-bold text-sm rounded-lg disabled:opacity-50"
                                >
                                    {loggingIn ? "登入中..." : "登入"}
                                </button>
                            </form>
                            <p className="text-[11px] t3 text-center mt-4">閒置超過 4 小時會自動登出</p>
                            {!isConfigured && (
                                <p className="text-[11px] t3 text-center mt-2">
                                    本地模擬模式測試帳號：admin01 / 123456（ADMIN）、usera01 / 111111（MEMBER）
                                </p>
                            )}
                        </div>
                    </div>
                );
            }

            const visibleTabs = canAccessAccounts(currentUser)
                ? ["總覽", "專案列表", "單位成員", "帳號管理"]
                : ["總覽", "專案列表", "單位成員"];

            // ===== 總覽統計 =====
            const overview = (() => {
                const total = projects.length;
                const byStatus = {};
                STATUS_LIST.forEach(s => byStatus[s] = projects.filter(p => normalizeStatus(p.status) === s).length);
                const byType = {
                    工具: projects.filter(p => p.type !== '專案').length,
                    專案: projects.filter(p => p.type === '專案').length,
                };
                const online = byStatus["上線"] || 0;
                const onlineRate = total > 0 ? Math.round(online / total * 100) : 0;
                // 各班別統計
                const byShift = {};
                UNIT_OPTIONS.forEach(u => {
                    const ps = projects.filter(p => {
                        const author = users.find(x => x.name === p.author);
                        return author && (UNIT_OPTIONS.includes(author.unit) ? author.unit : `${getBaseUnit(author)}-${getShift(author) || '早'}`) === u;
                    });
                    byShift[u] = { total: ps.length, online: ps.filter(p => normalizeStatus(p.status) === '上線').length };
                });
                // AI 工具使用次數排行
                const toolCount = {};
                projects.forEach(p => {
                    (p.ai_tools || "").split(/[,，、]/).map(t => t.trim()).filter(Boolean).forEach(t => {
                        toolCount[t] = (toolCount[t] || 0) + 1;
                    });
                });
                const topTools = Object.entries(toolCount).sort((a, b) => b[1] - a[1]).slice(0, 8);
                // 最近更新
                const recent = [...projects].sort((a, b) => (b.id > a.id ? 1 : -1)).slice(0, 6);
                return { total, byStatus, byType, online, onlineRate, byShift, topTools, recent };
            })();

            // ===== 匯出 CSV（Excel 可開）=====
            const exportCSV = () => {
                const headers = ["專案名稱", "類型", "狀態", "單位", "負責人", "共同研究", "AI工具", "痛點描述", "預期目標", "優化方法", "目前進展", "專案網址", "啟動日", "上線日"];
                const rows = filteredProjects.map(p => [
                    p.title, p.type, normalizeStatus(p.status), p.dept, p.author,
                    parseCollab(p.collaborators).join('、'), p.ai_tools,
                    p.pain_point, p.target, p.solution, p.progress, p.link, p.start_date, p.launch_date
                ]);
                const esc = (v) => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
                const csv = "\uFEFF" + [headers, ...rows].map(r => r.map(esc).join(",")).join("\r\n");
                const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `AI專案清單_${new Date().toLocaleDateString('zh-TW').replace(/\//g, '')}.csv`;
                a.click();
                URL.revokeObjectURL(url);
            };

            return (
                <div className="min-h-screen">
                    {/* 導覽列 */}
                    <nav className="app-card border-x-0 border-t-0 rounded-none px-6 py-3 flex flex-wrap gap-y-2 items-center justify-between sticky top-0 z-10">
                        <div className="flex items-center gap-6 flex-wrap">
                            <span className="font-black text-xl logo px-3 py-1.5 rounded">AI 成果</span>
                            <div className="flex gap-2 flex-wrap">
                                {visibleTabs.map(tab => (
                                    <button
                                        key={tab}
                                        onClick={() => { setCurrentTab(tab); setViewingProjectId(null); }}
                                        className={`px-4 py-1.5 rounded-full font-semibold text-sm transition-all ${currentTab === tab && !viewingProject ? 'navpill-active' : 'navpill'}`}
                                    >
                                        {tab}
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className="flex items-center gap-3 flex-wrap">
                            <ThemeToggle />
                            <button
                                onClick={() => { setShowMyPwModal(true); setMyPwForm({ oldPw: "", newPw: "", confirmPw: "" }); setMyPwError(""); }}
                                className="btn-ghost px-3 py-1.5 rounded-full text-xs font-semibold flex items-center gap-1.5"
                                title="點此修改我的密碼"
                            >
                                <span>👤 {currentUser.name}（{roleLabel(currentUser.role)}）</span>
                                <span className="accent">🔑 改密碼</span>
                            </button>
                            <button
                                onClick={() => { setNewProject(prev => ({ ...prev, dept: unitOfMember(currentUser.name) })); setShowProjectModal(true); }}
                                className="btn-accent font-bold px-4 py-2 rounded-xl text-sm transition-all"
                            >
                                + 發布 AI 專案
                            </button>
                            <button
                                onClick={handleLogout}
                                className="btn-danger px-3 py-2 rounded-xl text-sm font-semibold transition-all"
                            >
                                登出
                            </button>
                        </div>
                    </nav>

                    {/* ===== 總覽首頁 ===== */}
                    {currentTab === "總覽" && (
                        <div className="p-6 max-w-7xl mx-auto">
                            <div className="mb-6 flex items-end justify-between flex-wrap gap-3">
                                <div>
                                    <div className="page-eyebrow mb-1">DASHBOARD</div>
                                    <h1 className="page-title mb-1">總覽<span className="accent">.</span></h1>
                                    <p className="page-sub">全體 AI 專案成果一覽</p>
                                </div>
                                <button onClick={exportCSV} className="btn-ghost px-4 py-2.5 rounded-lg text-sm font-bold">⬇ 匯出專案清單 (Excel)</button>
                            </div>

                            {/* 數字卡 */}
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                                <div className="app-card rounded-xl p-5">
                                    <div className="text-sm t3 font-semibold mb-1">總專案數</div>
                                    <div className="text-4xl font-black t1">{overview.total}</div>
                                    <div className="text-xs t3 mt-1">工具 {overview.byType.工具}・專案 {overview.byType.專案}</div>
                                </div>
                                <div className="app-card rounded-xl p-5 edge-上線">
                                    <div className="text-sm t3 font-semibold mb-1">已上線</div>
                                    <div className="text-4xl font-black accent">{overview.online}</div>
                                    <div className="text-xs t3 mt-1">上線率 {overview.onlineRate}%</div>
                                </div>
                                <div className="app-card rounded-xl p-5 edge-開發測試中">
                                    <div className="text-sm t3 font-semibold mb-1">開發測試中</div>
                                    <div className="text-4xl font-black t1">{overview.byStatus["開發測試中"]}</div>
                                    <div className="text-xs t3 mt-1">進行中的專案</div>
                                </div>
                                <div className="app-card rounded-xl p-5 edge-下線">
                                    <div className="text-sm t3 font-semibold mb-1">已下線</div>
                                    <div className="text-4xl font-black t1">{overview.byStatus["下線"]}</div>
                                    <div className="text-xs t3 mt-1">停用的專案</div>
                                </div>
                            </div>

                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-4">
                                {/* 狀態分布長條 */}
                                <div className="app-card rounded-xl p-5">
                                    <h3 className="font-bold t1 mb-4">狀態分布</h3>
                                    <div className="space-y-3">
                                        {STATUS_LIST.map(s => {
                                            const n = overview.byStatus[s];
                                            const pct = overview.total > 0 ? Math.round(n / overview.total * 100) : 0;
                                            return (
                                                <div key={s}>
