<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 專案成果與進度追蹤平台</title>
  <!-- Tailwind CSS & FontAwesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              500: '#22c55e',
              600: '#16a34a',
              bg: '#0b0f19',
              card: '#151c2c',
              border: '#26334d'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#0b0f19] text-slate-200 font-sans min-h-screen flex flex-col antialiased">

  <!-- 顶部导航栏 -->
  <header class="bg-[#151c2c]/80 backdrop-blur-md border-b border-[#26334d] sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <!-- 左侧：身份标识 -->
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-500 to-cyan-500 flex items-center justify-center font-black text-black text-lg shadow-lg shadow-emerald-500/20">
          AI
        </div>
        <div>
          <span id="user-display" class="font-bold text-sm text-slate-100">未登入</span>
          <span class="text-xs text-slate-500 block">AI Project Hub</span>
        </div>
      </div>

      <!-- 中间：页签导航 -->
      <nav class="flex items-center bg-[#0b0f19] p-1 rounded-xl border border-[#26334d] text-xs font-bold">
        <button onclick="switchTab('overview')" id="tab-overview" class="px-4 py-1.5 rounded-lg text-emerald-400 bg-[#151c2c] transition">成員成果看板</button>
        <button onclick="switchTab('admin')" id="tab-admin" class="px-4 py-1.5 rounded-lg text-slate-400 hover:text-slate-200 transition hidden">帳號權限管理</button>
      </nav>

      <!-- 右侧：按钮与登出 -->
      <div class="flex items-center gap-3">
        <button onclick="openProjectModal()" class="bg-gradient-to-r from-emerald-500 to-teal-500 hover:opacity-90 text-black font-extrabold text-xs px-3.5 py-2 rounded-xl transition flex items-center gap-1.5 shadow-lg shadow-emerald-500/20">
          <i class="fa-solid fa-plus"></i> 發布 AI 專案
        </button>
        <button id="auth-btn" onclick="openLoginModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-3 py-2 rounded-xl border border-[#26334d]">
          登入
        </button>
      </div>
    </div>
  </header>

  <!-- 主体内容 -->
  <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">

    <!-- 1. 成员成果看板 Tab -->
    <section id="page-overview" class="space-y-8">
      <div>
        <h1 class="text-2xl font-black text-white">成員 AI 專案成果<span class="text-emerald-500">.</span></h1>
        <p class="text-slate-400 text-xs mt-1">按成員自動歸類展示專案，點擊區域可展開查看完整細節与討論。</p>
      </div>

      <!-- 成员专案区块容器 (自动加载) -->
      <div id="members-container" class="space-y-6">
        <!-- 动态渲染成员区块 -->
      </div>
    </section>

    <!-- 2. 管理员账号管理 Tab (需求 2) -->
    <section id="page-admin" class="space-y-6 hidden">
      <div class="flex justify-between items-center">
        <div>
          <h1 class="text-2xl font-black text-white">帳號權限管理<span class="text-emerald-500">.</span></h1>
          <p class="text-slate-400 text-xs mt-1">管理員可在此新增成員、變更密碼、調整角色權限或停用帳號。</p>
        </div>
        <button onclick="openCreateUserModal()" class="bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-emerald-500/30 text-xs font-bold px-3 py-2 rounded-xl">
          <i class="fa-solid fa-user-plus mr-1"></i> 新增成員帳號
        </button>
      </div>

      <div class="bg-[#151c2c] border border-[#26334d] rounded-2xl overflow-hidden shadow-xl">
        <table class="w-full text-left text-xs">
          <thead class="bg-[#0b0f19] text-slate-400 font-bold border-b border-[#26334d]">
            <tr>
              <th class="p-4">成員名稱</th>
              <th class="p-4">角色權限</th>
              <th class="p-4">帳號狀態</th>
              <th class="p-4 text-right">操作管理</th>
            </tr>
          </thead>
          <tbody id="user-table-body" class="divide-y divide-[#26334d]/50">
            <!-- 动态渲染账号列表 -->
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- ================= 模态框组 (MODALS) ================= -->

  <!-- 1. 发布/编辑专案弹窗 (需求 5) -->
  <div id="modal-project" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-[#151c2c] border border-[#26334d] rounded-2xl p-6 max-w-2xl w-full max-h-[90vh] overflow-y-auto text-xs shadow-2xl">
      <div class="flex justify-between items-center mb-4 border-b border-[#26334d] pb-3">
        <h3 class="text-base font-bold text-white">發布 AI 專案成果</h3>
        <button onclick="closeModal('modal-project')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form id="form-project" class="space-y-4">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-slate-400 font-bold mb-1">專案名稱 *</label>
            <input type="text" id="p-title" required class="w-full bg-[#0b0f19] border border-[#26334d] rounded-xl px-3 py-2 text-white focus:border-emerald-500 outline-none">
          </div>
          <div>
            <label class="block text-slate-400 font-bold mb-1">專案狀態</label>
            <select id="p-status" class="w-full bg-[#0b0f19] border border-[#26334d] rounded-xl px-3 py-2 text-white outline-none">
              <option value="上線">🟢 已上線</option>
              <option value="測試中">🟡 測試中</option>
              <option value="開發中">🔵 開發中</option>
              <option value="規劃中">⚪ 規劃中</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-slate-400 font-bold mb-1">現況描述 (痛點與背景) *</label>
          <textarea id="p-current" rows="2" required placeholder="說明目前流程遇到的瓶頸..." class="w-full bg-[#0b0f19] border border-[#26334d] rounded-xl px-3 py-2 text-white outline-none"></textarea>
        </div>

        <div>
          <label class="block text-slate-400 font-bold mb-1">預期目標 (例如：省下人力工時/提高效率) *</label>
          <textarea id="p-goal" rows="2" required placeholder="預期達成的具體效益..." class="w-full bg-[#0b0f19] border border-[#26334d] rounded-xl px-3 py-2 text-white outline-none"></textarea>
        </div>

        <div>
          <label class="block text-slate-400 font-bold mb-1">如何優化與操作流程 *</label>
          <textarea id="p-guide" rows="3" required placeholder="詳細操作步驟與操作指令/ Prompt..." class="w-full bg-[#0b0f19] border border-[#26334d] rounded-xl px-3 py-2 text-white outline-none"></textarea>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-slate-400 font-bold mb-1">運用 AI 工具 (用半角逗號分隔)</label>
            <input type="text" id="p-tools" placeholder="ChatGPT, Claude, Midjourney" class="w-full bg-[#0b0f19] border border-[#26334d] rounded-xl px-3 py-2 text-white outline-none">
          </div>
          <div>
            <label class="block text-slate-400 font-bold mb-1">成果截圖 URL</label>
            <input type="url" id="p-image" placeholder="https://..." class="w-full bg-[#0b0f19] border border-[#26334d] rounded-xl px-3 py-2 text-white outline-none">
          </div>
        </div>

        <div>
          <label class="block text-slate-400 font-bold mb-1">專案展示/操作網址</label>
          <input type="url" id="p-demo" placeholder="https://..." class="w-full bg-[#0b0f19] border border-[#26334d] rounded-xl px-3 py-2 text-white outline-none">
        </div>

        <div class="flex justify-end gap-2 pt-2 border-t border-[#26334d]">
          <button type="button" onclick="closeModal('modal-project')" class="px-4 py-2 text-slate-400 hover:text-white">取消</button>
          <button type="submit" class="bg-emerald-500 hover:bg-emerald-600 text-black font-extrabold px-5 py-2 rounded-xl">提交發布</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 2. 专案详情与讨论/建议弹窗 (需求 5 & 6) -->
  <div id="modal-detail" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-[#151c2c] border border-[#26334d] rounded-2xl p-6 max-w-3xl w-full max-h-[90vh] overflow-y-auto text-xs shadow-2xl space-y-6">
      
      <!-- 头部 -->
      <div class="flex justify-between items-start border-b border-[#26334d] pb-4">
        <div>
          <div class="flex items-center gap-2 mb-1">
            <span id="d-status" class="px-2 py-0.5 rounded-md font-bold text-[10px]"></span>
            <span id="d-author" class="text-slate-400"></span>
          </div>
          <h2 id="d-title" class="text-xl font-black text-white"></h2>
        </div>
        <button onclick="closeModal('modal-detail')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <!-- AI 工具标签 -->
      <div id="d-tools" class="flex flex-wrap gap-1.5"></div>

      <!-- 核心内容 3 板块 -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="bg-[#0b0f19] p-3.5 rounded-xl border border-[#26334d]">
          <span class="text-emerald-400 font-bold block mb-1">📌 現況描述</span>
          <p id="d-current" class="text-slate-300 leading-relaxed whitespace-pre-line"></p>
        </div>
        <div class="bg-[#0b0f19] p-3.5 rounded-xl border border-[#26334d]">
          <span class="text-cyan-400 font-bold block mb-1">🎯 預期目標</span>
          <p id="d-goal" class="text-slate-300 leading-relaxed whitespace-pre-line"></p>
        </div>
        <div class="bg-[#0b0f19] p-3.5 rounded-xl border border-[#26334d]">
          <span class="text-purple-400 font-bold block mb-1">⚙️ 優化與操作</span>
          <p id="d-guide" class="text-slate-300 leading-relaxed whitespace-pre-line"></p>
        </div>
      </div>

      <!-- 图片与链接 -->
      <div id="d-media" class="space-y-3 hidden">
        <div id="d-image-box" class="hidden">
          <img id="d-image" src="" class="rounded-xl border border-[#26334d] max-h-60 w-full object-cover">
        </div>
        <div id="d-demo-box" class="hidden">
          <a id="d-demo" href="#" target="_blank" class="inline-flex items-center gap-2 bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-3 py-1.5 rounded-lg hover:bg-emerald-500/20 font-bold">
            <i class="fa-solid fa-link"></i> 前往專案網址 / Demo
          </a>
        </div>
      </div>

      <!-- 专案探讨与建议区块 (需求 6) -->
      <div class="border-t border-[#26334d] pt-4 space-y-4">
        <h3 class="text-sm font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-comments text-emerald-400"></i> 專案探討與反饋建議
        </h3>

        <!-- 评论提交 -->
        <form id="form-comment" class="flex gap-2">
          <select id="c-type" class="bg-[#0b0f19] border border-[#26334d] rounded-xl px-2.5 py-2 text-slate-300 outline-none">
            <option value="SUGGESTION">💡 提供建議</option>
            <option value="TEST_RESULT">📊 實測成果/方向改進</option>
          </select>
          <input type="text" id="c-content" required placeholder="提出您的反饋或改進方向..." class="flex-1 bg-[#0b0f19] border border-[#26334d] rounded-xl px-3 py-2 text-white outline-none">
          <button type="submit" class="bg-emerald-500 text-black font-bold px-4 py-2 rounded-xl hover:bg-emerald-600">送出</button>
        </form>

        <!-- 评论列表 -->
        <div id="comments-list" class="space-y-2 max-h-48 overflow-y-auto">
          <!-- 动态渲染 -->
        </div>
      </div>

    </div>
  </div>

  <!-- 3. 登录弹窗 -->
  <div id="modal-login" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-[#151c2c] border border-[#26334d] rounded-2xl p-6 max-w-sm w-full text-xs shadow-2xl">
      <h3 class="text-base font-bold text-white mb-4 text-center">登入 AI 專案 Hub</h3>
      <form id="form-login" class="space-y-3">
        <div>
          <label class="block text-slate-400 mb-1">Email</label>
          <input type="email" id="l-email" required class="w-full bg-[#0b0f19] border border-[#26334d] rounded-xl px-3 py-2 text-white outline-none">
        </div>
        <div>
          <label class="block text-slate-400 mb-1">密碼</label>
          <input type="password" id="l-password" required class="w-full bg-[#0b0f19] border border-[#26334d] rounded-xl px-3 py-2 text-white outline-none">
        </div>
        <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-black font-extrabold py-2.5 rounded-xl mt-2">登入</button>
        <button type="button" onclick="closeModal('modal-login')" class="w-full text-slate-400 py-1">取消</button>
      </form>
    </div>
  </div>

  <!-- 4. 管理员新增成员弹窗 (需求 2) -->
  <div id="modal-create-user" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-[#151c2c] border border-[#26334d] rounded-2xl p-6 max-w-sm w-full text-xs shadow-2xl">
      <h3 class="text-base font-bold text-white mb-4">新增成員帳號</h3>
      <form id="form-create-user" class="space-y-3">
        <div>
          <label class="block text-slate-400 mb-1">成員名稱/暱稱</label>
          <input type="text" id="u-name" required class="w-full bg-[#0b0f19] border border-[#26334d] rounded-xl px-3 py-2 text-white outline-none">
        </div>
        <div>
          <label class="block text-slate-400 mb-1">Email</label>
          <input type="email" id="u-email" required class="w-full bg-[#0b0f19] border border-[#26334d] rounded-xl px-3 py-2 text-white outline-none">
        </div>
        <div>
          <label class="block text-slate-400 mb-1">預設密碼</label>
          <input type="password" id="u-pass" required class="w-full bg-[#0b0f19] border border-[#26334d] rounded-xl px-3 py-2 text-white outline-none">
        </div>
        <div>
          <label class="block text-slate-400 mb-1">角色權限</label>
          <select id="u-role" class="w-full bg-[#0b0f19] border border-[#26334d] rounded-xl px-3 py-2 text-white outline-none">
            <option value="MEMBER">MEMBER (一般成員)</option>
            <option value="ADMIN">ADMIN (管理員)</option>
          </select>
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeModal('modal-create-user')" class="px-3 py-2 text-slate-400">取消</button>
          <button type="submit" class="bg-emerald-500 text-black font-bold px-4 py-2 rounded-xl">建立帳號</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JavaScript 核心逻辑代码 -->
  <script>
    // ⚠️ 請替換為您的 Supabase URL 与 Anon Key
    const SUPABASE_URL = 'https://pbdgrwokkulcjsyoknhu.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let userProfile = null;
    let activeProjectId = null;

    // 初始化
    window.addEventListener('DOMContentLoaded', async () => {
      await checkAuth();
      loadOverviewData();
    });

    // 检查登录状态
    async function checkAuth() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        currentUser = session.user;
        const { data } = await supabaseClient.from('profiles').select('*').eq('id', currentUser.id).single();
        userProfile = data;

        // 需求 3: 动态更新左上角 (Name (ADMIN/MEMBER))
        const roleTag = userProfile.role === 'ADMIN' ? 'ADMIN' : 'MEMBER';
        document.getElementById('user-display').innerText = `${userProfile.username} (${roleTag})`;

        // 管理员专用页签显示
        if (userProfile.role === 'ADMIN') {
          document.getElementById('tab-admin').classList.remove('hidden');
        }

        document.getElementById('auth-btn').innerText = '登出';
        document.getElementById('auth-btn').onclick = logout;
      } else {
        document.getElementById('user-display').innerText = '未登入';
        document.getElementById('tab-admin').classList.add('hidden');
      }
    }

    // 页签切换
    function switchTab(tab) {
      if (tab === 'overview') {
        document.getElementById('page-overview').classList.remove('hidden');
        document.getElementById('page-admin').classList.add('hidden');
        document.getElementById('tab-overview').className = 'px-4 py-1.5 rounded-lg text-emerald-400 bg-[#151c2c] transition';
        document.getElementById('tab-admin').className = 'px-4 py-1.5 rounded-lg text-slate-400 hover:text-slate-200 transition';
      } else {
        document.getElementById('page-overview').classList.add('hidden');
        document.getElementById('page-admin').classList.remove('hidden');
        document.getElementById('tab-admin').className = 'px-4 py-1.5 rounded-lg text-emerald-400 bg-[#151c2c] transition';
        document.getElementById('tab-overview').className = 'px-4 py-1.5 rounded-lg text-slate-400 hover:text-slate-200 transition';
        loadAdminData();
      }
    }

    // 需求 4: 自动归类成员专案（可展开区块）
    async function loadOverviewData() {
      const container = document.getElementById('members-container');
      container.innerHTML = '<p class="text-slate-500">載入中...</p>';

      // 获取所有成员与对应专案
      const { data: profiles } = await supabaseClient.from('profiles').select('*, projects(*)');
      if (!profiles) return;

      container.innerHTML = '';
      profiles.forEach(p => {
        const pCount = p.projects ? p.projects.length : 0;
        const blockHtml = `
          <div class="bg-[#151c2c] border border-[#26334d] rounded-2xl overflow-hidden shadow-lg">
            <!-- 区块标头 (点击展开/折叠) -->
            <div onclick="toggleMemberBlock('${p.id}')" class="p-4 bg-[#151c2c] hover:bg-[#1c263c] cursor-pointer flex justify-between items-center transition">
              <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-slate-800 border border-[#26334d] flex items-center justify-center font-bold text-emerald-400 text-xs">
                  ${p.username.slice(0,2)}
                </div>
                <div>
                  <h3 class="font-bold text-white text-sm">${p.username} 的 AI 成果看板</h3>
                  <span class="text-[10px] text-slate-400">已發布 ${pCount} 個專案</span>
                </div>
              </div>
              <i id="arrow-${p.id}" class="fa-solid fa-chevron-down text-slate-400 transition-transform"></i>
            </div>

            <!-- 专案列表内容区块 -->
            <div id="block-${p.id}" class="p-4 border-t border-[#26334d]/50 bg-[#0b0f19]/50 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
              ${pCount === 0 ? '<p class="text-slate-500 text-xs col-span-full">尚無發布的專案</p>' : ''}
              ${(p.projects || []).map(prj => `
                <div onclick="openDetailModal(${prj.id})" class="bg-[#151c2c] border border-[#26334d] hover:border-emerald-500/50 p-4 rounded-xl cursor-pointer transition shadow-sm space-y-2">
                  <div class="flex justify-between items-start">
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">${prj.status}</span>
                    <span class="text-[10px] text-slate-500">${new Date(prj.created_at).toLocaleDateString()}</span>
                  </div>
                  <h4 class="font-bold text-slate-100 text-sm line-clamp-1">${prj.title}</h4>
                  <p class="text-slate-400 text-xs line-clamp-2">${prj.current_situation}</p>
                </div>
              `).join('')}
            </div>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', blockHtml);
      });
    }

    function toggleMemberBlock(id) {
      const block = document.getElementById(`block-${id}`);
      const arrow = document.getElementById(`arrow-${id}`);
      block.classList.toggle('hidden');
      arrow.classList.toggle('rotate-180');
    }

    // 需求 5 & 6: 打开专案详情与讨论
    async function openDetailModal(projectId) {
      activeProjectId = projectId;
      const { data: prj } = await supabaseClient.from('projects').select('*, profiles(username)').eq('id', projectId).single();
      
      document.getElementById('d-title').innerText = prj.title;
      document.getElementById('d-author').innerText = `發布者：${prj.profiles ? prj.profiles.username : '未知'}`;
      document.getElementById('d-status').innerText = prj.status;
      document.getElementById('d-status').className = 'px-2 py-0.5 rounded-md font-bold text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/30';
      
      document.getElementById('d-current').innerText = prj.current_situation || '无';
      document.getElementById('d-goal').innerText = prj.expected_goal || '无';
      document.getElementById('d-guide').innerText = prj.optimization_guide || '无';

      // 标签
      const toolsBox = document.getElementById('d-tools');
      toolsBox.innerHTML = (prj.ai_tools || []).map(t => `<span class="bg-slate-800 text-slate-300 border border-[#26334d] px-2 py-0.5 rounded text-[10px]">${t}</span>`).join('');

      // 图片与 Demo
      const mediaBox = document.getElementById('d-media');
      let hasMedia = false;
      if (prj.image_url) {
        document.getElementById('d-image').src = prj.image_url;
        document.getElementById('d-image-box').classList.remove('hidden');
        hasMedia = true;
      } else { document.getElementById('d-image-box').classList.add('hidden'); }

      if (prj.demo_url) {
        document.getElementById('d-demo').href = prj.demo_url;
        document.getElementById('d-demo-box').classList.remove('hidden');
        hasMedia = true;
      } else { document.getElementById('d-demo-box').classList.add('hidden'); }

      if (hasMedia) mediaBox.classList.remove('hidden');
      else mediaBox.classList.add('hidden');

      loadComments(projectId);
      openModal('modal-detail');
    }

    // 需求 6: 加载并送出专案建议/探讨
    async function loadComments(projectId) {
      const list = document.getElementById('comments-list');
      list.innerHTML = '<p class="text-slate-500">載入討論中...</p>';
      const { data } = await supabaseClient.from('project_comments').select('*, profiles(username)').eq('project_id', projectId).order('created_at', { ascending: false });

      list.innerHTML = '';
      if (!data || data.length === 0) {
        list.innerHTML = '<p class="text-slate-500 text-[10px]">暫無探討建議，歡迎提出第一個建議！</p>';
        return;
      }

      data.forEach(c => {
        const isSuggest = c.comment_type === 'SUGGESTION';
        list.insertAdjacentHTML('beforeend', `
          <div class="bg-[#0b0f19] p-2.5 rounded-xl border border-[#26334d] flex justify-between items-start">
            <div>
              <div class="flex items-center gap-2 mb-1">
                <span class="font-bold text-slate-200">${c.profiles ? c.profiles.username : '匿名'}</span>
                <span class="${isSuggest ? 'bg-amber-500/10 text-amber-400 border-amber-500/20' : 'bg-cyan-500/10 text-cyan-400 border-cyan-500/20'} border text-[9px] px-1.5 py-0.2 rounded font-bold">
                  ${isSuggest ? '💡 建議' : '📊 實測/方向'}
                </span>
              </div>
              <p class="text-slate-300">${c.content}</p>
            </div>
            <span class="text-[9px] text-slate-500">${new Date(c.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
          </div>
        `);
      });
    }

    document.getElementById('form-comment').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentUser) return alert('請先登入');
      const content = document.getElementById('c-content').value;
      const comment_type = document.getElementById('c-type').value;

      await supabaseClient.from('project_comments').insert([{ project_id: activeProjectId, user_id: currentUser.id, content, comment_type }]);
      document.getElementById('c-content').value = '';
      loadComments(activeProjectId);
    });

    // 需求 2: 管理员账号面板逻辑
    async function loadAdminData() {
      const tbody = document.getElementById('user-table-body');
      tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-slate-500">載入成員列表中...</td></tr>';
      const { data: users } = await supabaseClient.from('profiles').select('*');

      tbody.innerHTML = '';
      users.forEach(u => {
        tbody.insertAdjacentHTML('beforeend', `
          <tr class="hover:bg-[#1c263c]/50">
            <td class="p-4 font-bold text-white">${u.username}</td>
            <td class="p-4">
              <select onchange="updateUserRole('${u.id}', this.value)" class="bg-[#0b0f19] border border-[#26334d] text-slate-300 rounded px-2 py-1">
                <option value="MEMBER" ${u.role === 'MEMBER' ? 'selected' : ''}>MEMBER</option>
                <option value="ADMIN" ${u.role === 'ADMIN' ? 'selected' : ''}>ADMIN</option>
              </select>
            </td>
            <td class="p-4">
              <span class="${u.is_active ? 'text-emerald-400' : 'text-rose-400'} font-bold">
                ${u.is_active ? '● 正常' : '● 已停用'}
              </span>
            </td>
            <td class="p-4 text-right space-x-2">
              <button onclick="toggleUserActive('${u.id}', ${!u.is_active})" class="text-xs px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 border border-[#26334d]">
                ${u.is_active ? '停用帳號' : '啟用帳號'}
              </button>
            </td>
          </tr>
        `);
      });
    }

    async function updateUserRole(userId, role) {
      await supabaseClient.from('profiles').update({ role }).eq('id', userId);
      alert('權限已更新');
    }

    async function toggleUserActive(userId, is_active) {
      await supabaseClient.from('profiles').update({ is_active }).eq('id', userId);
      loadAdminData();
    }

    // 登录/发布/弹窗控制函数
    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    function openLoginModal() { openModal('modal-login'); }
    function openProjectModal() {
      if (!currentUser) return alert('請先登入帳號！');
      openModal('modal-project');
    }
    function openCreateUserModal() { openModal('modal-create-user'); }

    // 表单提交：登入
    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('l-email').value;
      const password = document.getElementById('l-password').value;
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) alert('登入失敗: ' + error.message);
      else location.reload();
    });

    // 表单提交：发布专案
    document.getElementById('form-project').addEventListener('submit', async (e) => {
      e.preventDefault();
      const tools = document.getElementById('p-tools').value.split(',').map(s => s.trim()).filter(Boolean);
      await supabaseClient.from('projects').insert([{
        user_id: currentUser.id,
        title: document.getElementById('p-title').value,
        status: document.getElementById('p-status').value,
        current_situation: document.getElementById('p-current').value,
        expected_goal: document.getElementById('p-goal').value,
        optimization_guide: document.getElementById('p-guide').value,
        ai_tools: tools,
        image_url: document.getElementById('p-image').value,
        demo_url: document.getElementById('p-demo').value
      }]);
      closeModal('modal-project');
      loadOverviewData();
      alert('🎉 專案發布成功！');
    });

    async function logout() {
      await supabaseClient.auth.signOut();
      location.reload();
    }
  </script>
</body>
</html>
