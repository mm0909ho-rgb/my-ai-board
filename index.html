<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 成果 Dashboard</title>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <style>
        body { background-color: #0d1117; color: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .dark-card { background-color: #161b22; border: 1px solid #30363d; }
        .dark-input { background-color: #21262d; border: 1px solid #30363d; color: #f0f6fc; }
        .dark-input:focus { border-color: #3fb950; outline: none; }

        .tag-status-規劃 { background-color: #21262d; color: #8b949e; border: 1px solid #30363d; }
        .tag-status-開發 { background-color: #1f6beb33; color: #58a6ff; border: 1px solid #1f6beb66; }
        .tag-status-測試 { background-color: #d2992233; color: #f2cc60; border: 1px solid #d2992266; }
        .tag-status-上線 { background-color: #23863633; color: #3fb950; border: 1px solid #23863666; }
        .tag-status-下線 { background-color: #da363333; color: #f85149; border: 1px solid #da363366; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // ⚠️ 請填入你的 Supabase 連線資訊 ⚠️
        const SUPABASE_URL = "https://pbdgrwokkulcjsyoknhu.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBiZGdyd29ra3VsY2pzeW9rbmh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MzA2NDIsImV4cCI6MjEwMjMwNjY0Mn0.uDEfM8o5B81IjjG9dw1bUqNA7BRdlriPXhJe7EZYZOQ";

        const isConfigured = SUPABASE_URL && !SUPABASE_URL.includes("your-project-id");
        const supabase = isConfigured && window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        // 帳號格式：需同時包含英文字母與數字
        const ACCOUNT_REGEX = /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z0-9]+$/;
        // 密碼格式：固定 6 碼數字
        const PASSWORD_REGEX = /^\d{6}$/;

        // 登入狀態儲存 Key（localStorage 依「網域」各自獨立保存，換網域需各自登入一次）
        const SESSION_KEY = "ai_dashboard_session";

        const STATUS_LIST = ["規劃", "開發", "測試", "上線", "下線"];
        const MAX_IMAGES = 3;

        // 單位選項（含三班）
        const UNIT_OPTIONS = ["JJ-早", "JJ-中", "JJ-晚"];
        // 從 unit 取得班別（"JJ-早" → "早"），舊資料無班別時退回 shift 欄位
        const getShift = (u) => {
            if (u.unit && u.unit.includes('-')) return u.unit.split('-')[1];
            return u.shift || '';
        };
        // 從 unit 取得基礎單位（"JJ-早" → "JJ"）
        const getBaseUnit = (u) => {
            if (!u.unit) return 'JJ';
            return u.unit.split('-')[0];
        };

        // 解析 image_url：支援舊格式（單一字串）與新格式（JSON 陣列字串），統一回傳陣列
        const parseImages = (val) => {
            if (!val) return [];
            if (typeof val === 'string' && val.trim().startsWith('[')) {
                try {
                    const arr = JSON.parse(val);
                    return Array.isArray(arr) ? arr.filter(Boolean) : [];
                } catch (e) { return [val]; }
            }
            return [val];
        };

        function App() {
            const [currentTab, setCurrentTab] = useState("專案列表");
            const [projects, setProjects] = useState([]);

            // 本地模擬模式下的預設帳號（若有接 Supabase，會被 profiles 表資料取代）
            const [users, setUsers] = useState([
                { id: "1", name: "Admin", account: "admin01", password: "123456", role: "ADMIN", unit: "JJ-早", shift: "早", status: "active" },
                { id: "2", name: "成員 A", account: "usera01", password: "111111", role: "MEMBER", unit: "JJ-中", shift: "中", status: "active" }
            ]);

            // ===== 登入狀態 =====
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [currentUser, setCurrentUser] = useState(null);
            const [loginForm, setLoginForm] = useState({ account: "", password: "" });
            const [loginError, setLoginError] = useState("");
            const [loggingIn, setLoggingIn] = useState(false);
            const [restoring, setRestoring] = useState(true); // 還原登入狀態中

            // Modal 控制
            const [showProjectModal, setShowProjectModal] = useState(false);
            const [showUserModal, setShowUserModal] = useState(false);
            const [submitting, setSubmitting] = useState(false);

            // 目前正在編輯的專案 id（null = 新增模式）
            const [editingProjectId, setEditingProjectId] = useState(null);

            // 專案詳情頁：目前檢視中的專案 id（null = 顯示列表）
            const [viewingProjectId, setViewingProjectId] = useState(null);
            // 圖片放大燈箱
            const [lightboxUrl, setLightboxUrl] = useState(null);

            // ===== 留言與更新紀錄 =====
            const [comments, setComments] = useState([]);
            const [newComment, setNewComment] = useState("");
            const [postingComment, setPostingComment] = useState(false);

            // ===== 搜尋 / 篩選 =====
            const [searchText, setSearchText] = useState("");
            const [filterStatus, setFilterStatus] = useState("全部");
            const [filterAuthor, setFilterAuthor] = useState("全部");
            const [filterType, setFilterType] = useState("全部");

            // ===== 編輯成員帳號 Modal =====
            const [editUserTarget, setEditUserTarget] = useState(null); // 正在編輯的成員
            const [editUserForm, setEditUserForm] = useState({ name: "", role: "MEMBER", unit: "JJ-早", password: "" });
            const [editUserSaving, setEditUserSaving] = useState(false);

            // 發布 / 編輯專案 Form（images 為 1~3 張圖的陣列，儲存時打包進 image_url）
            const [newProject, setNewProject] = useState({
                title: "",
                type: "小工具",
                dept: "JJ",
                author: "",
                status: "規劃",
                link: "",
                images: [],
                pain_point: "",
                target: "",
                solution: "",
                progress: ""
            });

            // 新增成員 Form
            const [newUser, setNewUser] = useState({
                name: "", account: "", password: "", email: "", role: "ADMIN", unit: "JJ-早", shift: "早"
            });

            // ===== 初始化：還原登入狀態 + 讀取資料 =====
            useEffect(() => {
                const init = async () => {
                    try {
                        let saved = null;
                        try { saved = JSON.parse(localStorage.getItem(SESSION_KEY)); } catch (e) {}

                        if (saved && saved.account) {
                            if (supabase) {
                                // 重新向資料庫驗證帳號仍存在且未被停用
                                const { data } = await supabase
                                    .from('profiles')
                                    .select('*')
                                    .eq('account', saved.account)
                                    .maybeSingle();
                                if (data && data.status !== 'disabled') {
                                    setCurrentUser({ id: data.id, name: data.name, role: data.role, account: data.account });
                                    setIsLoggedIn(true);
                                } else {
                                    localStorage.removeItem(SESSION_KEY);
                                }
                            } else {
                                setCurrentUser(saved);
                                setIsLoggedIn(true);
                            }
                        }
                    } catch (e) {
                        console.error("還原登入狀態失敗：", e);
                    } finally {
                        setRestoring(false);
                    }
                    fetchData();
                };
                init();
            }, []);

            // ESC 關閉燈箱
            useEffect(() => {
                const onKey = (e) => { if (e.key === "Escape") setLightboxUrl(null); };
                window.addEventListener("keydown", onKey);
                return () => window.removeEventListener("keydown", onKey);
            }, []);

            const fetchData = async () => {
                if (supabase) {
                    try {
                        const { data: projData } = await supabase.from('projects').select('*').order('id', { ascending: false });
                        const { data: userData } = await supabase.from('profiles').select('*');
                        if (projData) setProjects(projData);
                        if (userData && userData.length > 0) setUsers(userData);
                        // 留言與更新紀錄（若尚未建立 comments 表，讀取失敗不影響其他功能）
                        const { data: commentData } = await supabase.from('comments').select('*').order('id', { ascending: true });
                        if (commentData) setComments(commentData);
                    } catch (err) {
                        console.error("讀取失敗：", err);
                    }
                }
            };

            // ===== 登入 =====
            const handleLogin = async (e) => {
                e.preventDefault();
                setLoginError("");
                const account = loginForm.account.trim();
                const password = loginForm.password.trim();
                if (!account || !password) {
                    setLoginError("請輸入帳號與密碼");
                    return;
                }

                setLoggingIn(true);
                try {
                    let userObj = null;
                    if (supabase) {
                        const { data, error } = await supabase
                            .from('profiles')
                            .select('*')
                            .eq('account', account)
                            .eq('password', password)
                            .maybeSingle();

                        if (error || !data) {
                            setLoginError("帳號或密碼錯誤");
                        } else if (data.status === 'disabled') {
                            setLoginError("此帳號已被停用，請聯絡管理員");
                        } else {
                            userObj = { id: data.id, name: data.name, role: data.role, account: data.account };
                        }
                    } else {
                        const matched = users.find(u => u.account === account && u.password === password);
                        if (!matched) {
                            setLoginError("帳號或密碼錯誤（本地模擬模式）");
                        } else if (matched.status === 'disabled') {
                            setLoginError("此帳號已被停用，請聯絡管理員");
                        } else {
                            userObj = { id: matched.id, name: matched.name, role: matched.role, account: matched.account };
                        }
                    }

                    if (userObj) {
                        setCurrentUser(userObj);
                        setIsLoggedIn(true);
                        // 記住登入狀態（重新整理不會登出）
                        try { localStorage.setItem(SESSION_KEY, JSON.stringify(userObj)); } catch (e) {}
                    }
                } catch (err) {
                    setLoginError("登入時發生錯誤，請稍後再試");
                } finally {
                    setLoggingIn(false);
                }
            };

            const handleLogout = () => {
                if (confirm("確定要登出系統嗎？")) {
                    setIsLoggedIn(false);
                    setCurrentUser(null);
                    setLoginForm({ account: "", password: "" });
                    setLoginError("");
                    setCurrentTab("專案列表");
                    setViewingProjectId(null);
                    try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
                }
            };

            // 判斷目前登入者是否能編輯／刪除此專案：發布者本人，或 ADMIN
            const canManageProject = (item) => {
                if (!currentUser) return false;
                return item.author === currentUser.name || currentUser.role === "ADMIN";
            };

            // ⚡ 圖片自動等比例壓縮 (最高 800px，品質 70%)，回傳 Promise<base64>
            const compressImage = (file) => new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onerror = () => reject(new Error("讀取圖片失敗"));
                reader.onload = (event) => {
                    const img = new Image();
                    img.onerror = () => reject(new Error("圖片格式不支援"));
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const maxDim = 800; // 最大寬或高

                        if (width > maxDim || height > maxDim) {
                            if (width > height) {
                                height = Math.round((height * maxDim) / width);
                                width = maxDim;
                            } else {
                                width = Math.round((width * maxDim) / height);
                                height = maxDim;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });

            // 上傳 1~3 張圖片（可一次多選）
            const handleImageUpload = async (e) => {
                const files = Array.from(e.target.files || []);
                e.target.value = ""; // 允許重複選同一檔案
                if (!files.length) return;

                const remaining = MAX_IMAGES - newProject.images.length;
                if (remaining <= 0) {
                    alert(`最多只能上傳 ${MAX_IMAGES} 張圖片，請先刪除不要的圖片`);
                    return;
                }
                if (files.length > remaining) {
                    alert(`最多 ${MAX_IMAGES} 張，將只加入前 ${remaining} 張`);
                }

                try {
                    const toProcess = files.slice(0, remaining);
                    const results = [];
                    for (const f of toProcess) {
                        results.push(await compressImage(f));
                    }
                    setNewProject(prev => ({
                        ...prev,
                        images: [...prev.images, ...results].slice(0, MAX_IMAGES)
                    }));
                } catch (err) {
                    alert("圖片處理失敗：" + err.message);
                }
            };

            // 刪除某一張已上傳的圖片
            const handleRemoveImage = (idx) => {
                setNewProject(prev => ({
                    ...prev,
                    images: prev.images.filter((_, i) => i !== idx)
                }));
            };

            // 開啟「編輯專案」彈窗，帶入既有資料
            const handleOpenEditProject = (item) => {
                if (!canManageProject(item)) return;
                setNewProject({
                    title: item.title || "",
                    type: item.type || "小工具",
                    dept: item.dept || "JJ",
                    author: item.author || "",
                    status: item.status || "規劃",
                    link: item.link || "",
                    images: parseImages(item.image_url),
                    pain_point: item.pain_point || "",
                    target: item.target || "",
                    solution: item.solution || "",
                    progress: item.progress || ""
                });
                setEditingProjectId(item.id);
                setShowProjectModal(true);
            };

            // 關閉專案彈窗（新增／編輯共用），並重置狀態
            const handleCloseProjectModal = () => {
                setShowProjectModal(false);
                setEditingProjectId(null);
                resetProjectForm();
            };

            // 將表單狀態轉為資料庫欄位（images 陣列 → image_url 字串）
            const buildProjectPayload = (form) => {
                const { images, ...rest } = form;
                return {
                    ...rest,
                    image_url: images && images.length > 0 ? JSON.stringify(images) : ""
                };
            };

            // 發布 或 更新 專案
            const handleAddProject = async (e) => {
                e.preventDefault();
                if (!newProject.title) return alert("請輸入專案名稱");

                setSubmitting(true);

                try {
                    if (editingProjectId) {
                        // ===== 編輯既有專案 =====
                        const original = projects.find(p => p.id === editingProjectId);
                        if (original && !canManageProject(original)) {
                            alert("您沒有權限編輯此專案（僅發布者本人或管理員可編輯）");
                            setSubmitting(false);
                            return;
                        }

                        const updates = {
                            ...buildProjectPayload(newProject),
                            launch_date: newProject.status === "上線"
                                ? (original && original.launch_date && original.launch_date !== "-" ? original.launch_date : new Date().toLocaleDateString())
                                : "-"
                        };

                        if (supabase) {
                            const { data, error } = await supabase.from('projects').update(updates).eq('id', editingProjectId).select();
                            if (error) {
                                alert("更新失敗：" + error.message + "\n\n（若錯誤為找不到 progress 欄位，請先到 Supabase 為 projects 表新增 progress 欄位）");
                            } else {
                                setProjects(projects.map(p => p.id === editingProjectId ? { ...p, ...updates } : p));
                                // 狀態有變更時，自動寫入系統更新紀錄
                                if (original && original.status !== newProject.status) {
                                    insertComment(editingProjectId, `狀態由「${original.status}」變更為「${newProject.status}」`, 'system').catch(() => {});
                                }
                                handleCloseProjectModal();
                                alert("✅ 已更新專案");
                            }
                        } else {
                            setProjects(projects.map(p => p.id === editingProjectId ? { ...p, ...updates } : p));
                            if (original && original.status !== newProject.status) {
                                insertComment(editingProjectId, `狀態由「${original.status}」變更為「${newProject.status}」`, 'system').catch(() => {});
                            }
                            handleCloseProjectModal();
                            alert("✅ (本地模擬) 已更新專案");
                        }
                    } else {
                        // ===== 新增專案 =====
                        const item = {
                            ...buildProjectPayload(newProject),
                            author: newProject.author || currentUser.name,
                            start_date: new Date().toLocaleDateString(),
                            launch_date: newProject.status === "上線" ? new Date().toLocaleDateString() : "-"
                        };

                        if (supabase) {
                            const { data, error } = await supabase.from('projects').insert([item]).select();
                            if (error) {
                                alert("發布失敗，請查看 Supabase 欄位是否齊全：" + error.message);
                            } else if (data) {
                                setProjects([data[0], ...projects]);
                                handleCloseProjectModal();
                                alert("🎉 發布成功！");
                            }
                        } else {
                            // 本地模擬模式
                            setProjects([{ id: Date.now(), ...item }, ...projects]);
                            handleCloseProjectModal();
                            alert("🎉 (本地模擬) 發布成功！");
                        }
                    }
                } catch (err) {
                    alert("連線發送失敗，請確認 Supabase 網址與 Key 是否正確！\n" + err.message);
                } finally {
                    setSubmitting(false);
                }
            };

            // 刪除專案（僅發布者本人或管理員）
            const handleDeleteProject = async (item) => {
                if (!canManageProject(item)) {
                    alert("您沒有權限刪除此專案（僅發布者本人或管理員可刪除）");
                    return;
                }
                if (!confirm(`確定要刪除專案「${item.title}」嗎？此動作無法復原。`)) return;

                try {
                    if (supabase) {
                        const { error } = await supabase.from('projects').delete().eq('id', item.id);
                        if (error) {
                            alert("刪除失敗：" + error.message);
                            return;
                        }
                        // 一併刪除該專案的留言紀錄（失敗不影響主要流程）
                        try { await supabase.from('comments').delete().eq('project_id', item.id); } catch (e) {}
                    }
                    setProjects(projects.filter(p => p.id !== item.id));
                    setComments(prev => prev.filter(c => c.project_id !== item.id));
                    if (viewingProjectId === item.id) setViewingProjectId(null);
                } catch (err) {
                    alert("刪除失敗，請確認連線是否正常！\n" + err.message);
                }
            };

            const resetProjectForm = () => {
                setNewProject({
                    title: "", type: "小工具", dept: "JJ", author: "", status: "規劃",
                    link: "", images: [], pain_point: "", target: "", solution: "", progress: ""
                });
            };

            // 新增成員帳號（僅 ADMIN 可操作）
            const handleAddUser = async (e) => {
                e.preventDefault();
                if (currentUser.role !== "ADMIN") {
                    return alert("僅管理員可新增成員帳號");
                }
                if (!newUser.name || !newUser.account || !newUser.password) {
                    return alert("請填寫完整資訊（暱稱、帳號、密碼皆為必填）");
                }
                if (!ACCOUNT_REGEX.test(newUser.account)) {
                    return alert("帳號格式錯誤：需為英文字母＋數字組合（例如 user01）");
                }
                if (!PASSWORD_REGEX.test(newUser.password)) {
                    return alert("密碼格式錯誤：需為 6 位數字（例如 123456）");
                }
                if (users.some(u => u.account === newUser.account)) {
                    return alert("此帳號已被使用，請更換其他帳號");
                }

                // 班別依單位自動帶入（JJ-早 → 早）
                const shift = newUser.unit.includes('-') ? newUser.unit.split('-')[1] : '早';
                const userItem = { ...newUser, shift, status: 'active' };

                if (supabase) {
                    const { data, error } = await supabase.from('profiles').insert([userItem]).select();
                    if (error) {
                        alert("新增失敗：" + error.message);
                    } else if (data) {
                        setUsers([...users, data[0]]);
                        setShowUserModal(false);
                        setNewUser({ name: "", account: "", password: "", email: "", role: "ADMIN", unit: "JJ-早", shift: "早" });
                        alert("🎉 成員帳號新增成功！");
                    }
                } else {
                    setUsers([...users, { id: String(users.length + 1), ...userItem }]);
                    setShowUserModal(false);
                    setNewUser({ name: "", account: "", password: "", email: "", role: "ADMIN", unit: "JJ-早", shift: "早" });
                    alert("🎉 (本地模擬) 成員帳號新增成功！");
                }
            };

            // ===== 帳號管理：停用 / 啟用 =====
            const handleToggleUserStatus = async (u) => {
                if (currentUser.role !== "ADMIN") return alert("僅管理員可操作");
                if (u.account === currentUser.account) return alert("不能停用自己的帳號");

                const isDisabled = u.status === 'disabled';
                const nextStatus = isDisabled ? 'active' : 'disabled';
                const actionText = isDisabled ? '啟用' : '停用';
                if (!confirm(`確定要${actionText}帳號「${u.name}（${u.account}）」嗎？`)) return;

                try {
                    if (supabase) {
                        const { error } = await supabase.from('profiles').update({ status: nextStatus }).eq('id', u.id);
                        if (error) {
                            alert(`${actionText}失敗：` + error.message + "\n\n（若錯誤為找不到 status 欄位，請先到 Supabase 為 profiles 表新增 status 欄位）");
                            return;
                        }
                    }
                    setUsers(users.map(x => x.id === u.id ? { ...x, status: nextStatus } : x));
                    alert(`✅ 已${actionText}帳號「${u.name}」`);
                } catch (err) {
                    alert(`${actionText}失敗，請確認連線是否正常！\n` + err.message);
                }
            };

            // ===== 帳號管理：開啟編輯成員彈窗 =====
            const handleOpenEditUser = (u) => {
                setEditUserTarget(u);
                setEditUserForm({
                    name: u.name || "",
                    role: u.role || "MEMBER",
                    unit: UNIT_OPTIONS.includes(u.unit) ? u.unit : "JJ-早",
                    password: "" // 留空 = 不變更
                });
            };

            // ===== 帳號管理：儲存成員編輯（暱稱／權限／單位／密碼） =====
            const handleSaveEditUser = async (e) => {
                e.preventDefault();
                if (!editUserTarget) return;
                if (currentUser.role !== "ADMIN") return alert("僅管理員可操作");

                const newName = editUserForm.name.trim();
                if (!newName) return alert("暱稱不可為空");
                if (editUserForm.password && !PASSWORD_REGEX.test(editUserForm.password)) {
                    return alert("密碼格式錯誤：需為 6 位數字（留空則不變更）");
                }
                // 不能把自己降為 MEMBER，避免失去管理權限後無法操作
                if (editUserTarget.account === currentUser.account && editUserForm.role !== "ADMIN") {
                    return alert("不能移除自己的管理員權限");
                }

                const shift = editUserForm.unit.includes('-') ? editUserForm.unit.split('-')[1] : '早';
                const updates = {
                    name: newName,
                    role: editUserForm.role,
                    unit: editUserForm.unit,
                    shift
                };
                if (editUserForm.password) updates.password = editUserForm.password;

                const oldName = editUserTarget.name;
                const nameChanged = oldName !== newName;

                setEditUserSaving(true);
                try {
                    if (supabase) {
                        const { error } = await supabase.from('profiles').update(updates).eq('id', editUserTarget.id);
                        if (error) {
                            alert("儲存失敗：" + error.message);
                            setEditUserSaving(false);
                            return;
                        }
                        // 暱稱變更時，同步更新該成員名下所有專案的負責人名稱
                        if (nameChanged) {
                            const { error: projErr } = await supabase.from('projects').update({ author: newName }).eq('author', oldName);
                            if (projErr) console.error("同步專案負責人失敗：", projErr);
                        }
                    }
                    setUsers(users.map(x => x.id === editUserTarget.id ? { ...x, ...updates } : x));
                    if (nameChanged) {
                        setProjects(projects.map(p => p.author === oldName ? { ...p, author: newName } : p));
                        // 若改的是自己，同步更新目前登入者顯示名稱與 localStorage
                        if (editUserTarget.account === currentUser.account) {
                            const updatedSelf = { ...currentUser, name: newName };
                            setCurrentUser(updatedSelf);
                            try { localStorage.setItem(SESSION_KEY, JSON.stringify(updatedSelf)); } catch (e) {}
                        }
                    }
                    setEditUserTarget(null);
                    alert("✅ 已儲存成員資料");
                } catch (err) {
                    alert("儲存失敗，請確認連線是否正常！\n" + err.message);
                } finally {
                    setEditUserSaving(false);
                }
            };

            // ===== 帳號管理：刪除成員帳號 =====
            const handleDeleteUser = async (u) => {
                if (currentUser.role !== "ADMIN") return alert("僅管理員可操作");
                if (u.account === currentUser.account) return alert("不能刪除自己的帳號");
                // 帳號若仍是某專案的負責人則無法刪除
                if (projects.some(p => p.author === u.name)) {
                    return alert(`「${u.name}」仍是某些專案的負責人，無法刪除。\n請先刪除其專案或將專案轉移給其他人（可改用「停用」）。`);
                }
                if (!confirm(`確定要刪除帳號「${u.name}（${u.account}）」嗎？此動作無法復原。`)) return;

                try {
                    if (supabase) {
                        const { error } = await supabase.from('profiles').delete().eq('id', u.id);
                        if (error) {
                            alert("刪除失敗：" + error.message);
                            return;
                        }
                    }
                    setUsers(users.filter(x => x.id !== u.id));
                    setEditUserTarget(null);
                    alert(`✅ 已刪除帳號「${u.name}」`);
                } catch (err) {
                    alert("刪除失敗，請確認連線是否正常！\n" + err.message);
                }
            };

            // ===== 留言與更新紀錄 =====
            const insertComment = async (projectId, content, kind) => {
                const item = {
                    project_id: projectId,
                    author: currentUser ? currentUser.name : "",
                    content,
                    kind,
                    created_at: new Date().toISOString()
                };
                if (supabase) {
                    const { data, error } = await supabase.from('comments').insert([item]).select();
                    if (error) throw error;
                    if (data) setComments(prev => [...prev, data[0]]);
                } else {
                    setComments(prev => [...prev, { id: Date.now(), ...item }]);
                }
            };

            const handlePostComment = async () => {
                const content = newComment.trim();
                if (!content || !viewingProject) return;
                setPostingComment(true);
                try {
                    await insertComment(viewingProject.id, content, 'comment');
                    setNewComment("");
                } catch (err) {
                    alert("留言失敗：" + err.message + "\n\n（若錯誤為找不到 comments 表，請先到 Supabase 建立 comments 表）");
                } finally {
                    setPostingComment(false);
                }
            };

            // 留言刪除權限：留言者本人或 ADMIN
            const canDeleteComment = (c) => {
                if (!currentUser) return false;
                return c.author === currentUser.name || currentUser.role === "ADMIN";
            };

            const handleDeleteComment = async (c) => {
                if (!canDeleteComment(c)) return;
                if (!confirm("確定要刪除這則紀錄嗎？")) return;
                try {
                    if (supabase) {
                        const { error } = await supabase.from('comments').delete().eq('id', c.id);
                        if (error) { alert("刪除失敗：" + error.message); return; }
                    }
                    setComments(prev => prev.filter(x => x.id !== c.id));
                } catch (err) {
                    alert("刪除失敗：" + err.message);
                }
            };

            const formatTime = (t) => {
                if (!t) return "";
                try { return new Date(t).toLocaleString('zh-TW', { hour12: false }); } catch (e) { return String(t); }
            };

            // ===== 專案搜尋 / 篩選 =====
            const filteredProjects = useMemo(() => {
                const kw = searchText.trim().toLowerCase();
                return projects.filter(p => {
                    if (filterStatus !== "全部" && p.status !== filterStatus) return false;
                    if (filterAuthor !== "全部" && p.author !== filterAuthor) return false;
                    if (filterType !== "全部" && p.type !== filterType) return false;
                    if (kw) {
                        const hay = [p.title, p.author, p.dept, p.pain_point, p.target, p.solution, p.progress]
                            .filter(Boolean).join(" ").toLowerCase();
                        if (!hay.includes(kw)) return false;
                    }
                    return true;
                });
            }, [projects, searchText, filterStatus, filterAuthor, filterType]);

            const hasActiveFilter = searchText.trim() !== "" || filterStatus !== "全部" || filterAuthor !== "全部" || filterType !== "全部";
            const clearFilters = () => { setSearchText(""); setFilterStatus("全部"); setFilterAuthor("全部"); setFilterType("全部"); };

            // ===== 單位成員：依成員統整專案（依上線數排名） =====
            const memberStats = useMemo(() => {
                const list = users.map(u => {
                    const ps = projects.filter(p => p.author === u.name);
                    const counts = {};
                    STATUS_LIST.forEach(s => counts[s] = ps.filter(p => p.status === s).length);
                    return { user: u, projects: ps, counts, total: ps.length };
                }).sort((a, b) => (b.counts["上線"] - a.counts["上線"]) || (b.total - a.total));
                // 全體排名
                return list.map((m, i) => ({ ...m, rank: i + 1 }));
            }, [users, projects]);

            // 依「基礎單位」分組（JJ-早/中/晚 都歸在 JJ 底下，卡片上顯示班別徽章）
            const unitGroups = useMemo(() => {
                const groups = {};
                memberStats.forEach(m => {
                    const unit = getBaseUnit(m.user);
                    if (!groups[unit]) groups[unit] = [];
                    groups[unit].push(m);
                });
                return groups;
            }, [memberStats]);

            const viewingProject = viewingProjectId != null
                ? projects.find(p => p.id === viewingProjectId)
                : null;

            // 開啟專案詳情（供列表卡片、成員頁的專案項目共用）
            const openProjectDetail = (item) => {
                setViewingProjectId(item.id);
                setCurrentTab("專案列表");
                window.scrollTo(0, 0);
            };

            // ===== 還原登入狀態中：顯示載入畫面，避免閃一下登入頁 =====
            if (restoring) {
                return (
                    <div className="min-h-screen flex items-center justify-center">
                        <div className="text-center">
                            <span className="font-black text-xl bg-emerald-500 text-black px-3 py-1.5 rounded inline-block">AI 成果</span>
                            <p className="text-gray-500 text-sm mt-4">載入中...</p>
                        </div>
                    </div>
                );
            }

            // ===== 尚未登入：顯示登入畫面 =====
            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className="w-full max-w-sm">
                            <div className="text-center mb-6">
                                <span className="font-black text-xl bg-emerald-500 text-black px-3 py-1.5 rounded inline-block">AI 成果</span>
                                <p className="text-gray-400 text-sm mt-3">請登入以管理專案與成員</p>
                            </div>
                            <form onSubmit={handleLogin} className="dark-card rounded-2xl p-6 space-y-4 shadow-2xl">
                                <div>
                                    <label className="text-xs text-gray-400 block mb-1">帳號</label>
                                    <input
                                        type="text"
                                        required
                                        autoFocus
                                        className="w-full p-2.5 rounded-lg dark-input text-sm"
                                        value={loginForm.account}
                                        onChange={e => setLoginForm({ ...loginForm, account: e.target.value })}
                                        placeholder="例如：user01"
                                    />
                                </div>
                                <div>
                                    <label className="text-xs text-gray-400 block mb-1">密碼</label>
                                    <input
                                        type="password"
                                        required
                                        inputMode="numeric"
                                        maxLength="6"
                                        className="w-full p-2.5 rounded-lg dark-input text-sm"
                                        value={loginForm.password}
                                        onChange={e => setLoginForm({ ...loginForm, password: e.target.value.replace(/\D/g, '').slice(0, 6) })}
                                        placeholder="6 位數字"
                                    />
                                </div>
                                {loginError && (
                                    <p className="text-xs text-red-400 bg-red-950/40 border border-red-900 rounded-lg px-3 py-2">{loginError}</p>
                                )}
                                <button
                                    type="submit"
                                    disabled={loggingIn}
                                    className="w-full py-2.5 bg-emerald-500 hover:bg-emerald-400 text-black font-bold text-sm rounded-lg disabled:opacity-50"
                                >
                                    {loggingIn ? "登入中..." : "登入"}
                                </button>
                            </form>
                            {!isConfigured && (
                                <p className="text-[11px] text-gray-500 text-center mt-4">
                                    本地模擬模式測試帳號：admin01 / 123456（ADMIN）、usera01 / 111111（MEMBER）
                                </p>
                            )}
                        </div>
                    </div>
                );
            }

            const visibleTabs = currentUser.role === "ADMIN"
                ? ["專案列表", "單位成員", "帳號管理"]
                : ["專案列表", "單位成員"];

            return (
                <div className="min-h-screen">
                    {/* 導覽列 */}
                    <nav className="bg-[#161b22] border-b border-gray-800 px-6 py-3 flex items-center justify-between sticky top-0 z-10">
                        <div className="flex items-center gap-6">
                            <span className="font-black text-lg bg-emerald-500 text-black px-2.5 py-1 rounded">AI 成果</span>
                            <div className="flex gap-2">
                                {visibleTabs.map(tab => (
                                    <button
                                        key={tab}
                                        onClick={() => { setCurrentTab(tab); setViewingProjectId(null); }}
                                        className={`px-4 py-1.5 rounded-full font-medium text-sm transition-all ${currentTab === tab && !viewingProject ? 'bg-emerald-500 text-black font-bold' : 'text-gray-300 hover:bg-[#21262d]'}`}
                                    >
                                        {tab}
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className="flex items-center gap-3">
                            <span className="text-xs text-gray-400">👤 {currentUser.name}（{currentUser.role}）</span>
                            <button
                                onClick={() => setShowProjectModal(true)}
                                className="bg-emerald-500 hover:bg-emerald-400 text-black font-bold px-4 py-2 rounded-xl text-sm shadow-lg transition-all"
                            >
                                + 發布 AI 專案
                            </button>
                            <button
                                onClick={handleLogout}
                                className="bg-red-950/60 hover:bg-red-900 text-red-400 border border-red-800/80 px-3 py-2 rounded-xl text-sm font-semibold transition-all"
                            >
                                登出
                            </button>
                        </div>
                    </nav>

                    {/* ===== 專案詳情頁 ===== */}
                    {currentTab === "專案列表" && viewingProject && (() => {
                        const detailImages = parseImages(viewingProject.image_url);
                        return (
                        <div className="p-6 max-w-5xl mx-auto">
                            <div className="mb-6">
                                <h1 className="text-2xl font-bold mb-1 text-white">專案詳情<span className="text-emerald-400">.</span></h1>
                                <p className="text-gray-400 text-sm">深入了解這個專案的來龍去脈與成效</p>
                            </div>

                            <button
                                onClick={() => setViewingProjectId(null)}
                                className="text-sm text-gray-400 hover:text-white mb-5 flex items-center gap-1"
                            >
                                ‹ 返回列表
                            </button>

                            <div className="flex flex-wrap items-center justify-between gap-3 mb-2">
                                <div className="flex items-center gap-3 flex-wrap">
                                    <h2 className="text-2xl font-black text-white">{viewingProject.title}</h2>
                                    <span className="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-[#21262d] text-gray-300 border border-gray-700">{viewingProject.type || '小工具'}</span>
                                    <span className={`px-3 py-1 rounded-full text-xs font-semibold tag-status-${viewingProject.status}`}>● {viewingProject.status}</span>
                                </div>
                                <div className="flex items-center gap-2">
                                    {viewingProject.link && (
                                        <a href={viewingProject.link} target="_blank" className="bg-emerald-500 hover:bg-emerald-400 text-black font-bold px-4 py-2 rounded-xl text-sm">🌐 前端連結</a>
                                    )}
                                    {canManageProject(viewingProject) && (
                                        <React.Fragment>
                                            <button onClick={() => handleOpenEditProject(viewingProject)} className="text-sm bg-[#21262d] hover:bg-[#30363d] text-gray-300 px-3 py-2 rounded-xl border border-gray-700">✏️ 編輯</button>
                                            <button onClick={() => handleDeleteProject(viewingProject)} className="text-sm bg-red-950/60 hover:bg-red-900 text-red-400 px-3 py-2 rounded-xl border border-red-800/80">🗑️ 刪除</button>
                                        </React.Fragment>
                                    )}
                                </div>
                            </div>

                            <p className="text-sm text-gray-400 mb-6">
                                負責人 {viewingProject.dept || 'JJ'}・{viewingProject.author}
                                {viewingProject.start_date && <span> ・ 啟動於 {viewingProject.start_date}</span>}
                                {viewingProject.launch_date && viewingProject.launch_date !== "-" && <span> ・ 上線於 {viewingProject.launch_date}</span>}
                            </p>

                            <div className="dark-card rounded-2xl p-6 space-y-6">
                                <div className="flex gap-4">
                                    <div className="w-1 rounded bg-red-500 shrink-0"></div>
                                    <div className="flex-1">
                                        <h3 className="font-bold text-sm text-red-400 mb-2">🚨 想解決什麼（痛點描述）</h3>
                                        <p className="text-sm text-gray-200 whitespace-pre-wrap leading-relaxed">{viewingProject.pain_point || "無"}</p>
                                    </div>
                                </div>
                                <div className="flex gap-4">
                                    <div className="w-1 rounded bg-blue-500 shrink-0"></div>
                                    <div className="flex-1">
                                        <h3 className="font-bold text-sm text-blue-400 mb-2">🎯 預期目標</h3>
                                        <p className="text-sm text-gray-200 whitespace-pre-wrap leading-relaxed">{viewingProject.target || "無"}</p>
                                    </div>
                                </div>
                                <div className="flex gap-4">
                                    <div className="w-1 rounded bg-emerald-500 shrink-0"></div>
                                    <div className="flex-1">
                                        <h3 className="font-bold text-sm text-emerald-400 mb-2">⚡ 我們怎麼做（優化方法）</h3>
                                        <p className="text-sm text-gray-200 whitespace-pre-wrap leading-relaxed">{viewingProject.solution || "無"}</p>
                                    </div>
                                </div>
                                <div className="flex gap-4">
                                    <div className="w-1 rounded bg-yellow-500 shrink-0"></div>
                                    <div className="flex-1">
                                        <h3 className="font-bold text-sm text-yellow-400 mb-2">📈 目前進展</h3>
                                        <p className="text-sm text-gray-200 whitespace-pre-wrap leading-relaxed">{viewingProject.progress || "無"}</p>
                                    </div>
                                </div>

                                {detailImages.length > 0 && (
                                    <div className="pt-2 border-t border-gray-800">
                                        <h3 className="font-bold text-sm text-gray-400 mb-2">📷 成果展示（點圖可放大）</h3>
                                        <div className="flex flex-wrap gap-3">
                                            {detailImages.map((img, i) => (
                                                <img
                                                    key={i}
                                                    src={img}
                                                    alt={`成果展示 ${i + 1}`}
                                                    onClick={() => setLightboxUrl(img)}
                                                    className="max-h-72 rounded-lg border border-gray-700 object-contain cursor-zoom-in hover:opacity-90 transition-opacity"
                                                />
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>

                            {/* 💬 留言與更新紀錄 */}
                            <div className="dark-card rounded-2xl p-6 mt-4">
                                <h3 className="font-bold text-sm text-gray-300 mb-4">
                                    💬 留言與更新紀錄
                                    <span className="text-gray-500 font-normal ml-1">({comments.filter(c => c.project_id === viewingProject.id).length})</span>
                                </h3>

                                <div className="flex gap-2 mb-5">
                                    <input
                                        type="text"
                                        className="flex-1 p-2.5 rounded-lg dark-input text-sm"
                                        placeholder="留言或記錄一筆進度更新...（Enter 送出）"
                                        value={newComment}
                                        onChange={e => setNewComment(e.target.value)}
                                        onKeyDown={e => { if (e.key === 'Enter') handlePostComment(); }}
                                    />
                                    <button
                                        onClick={handlePostComment}
                                        disabled={postingComment || !newComment.trim()}
                                        className="px-4 py-2 bg-emerald-500 hover:bg-emerald-400 text-black font-bold text-sm rounded-lg disabled:opacity-40"
                                    >
                                        {postingComment ? '送出中...' : '送出'}
                                    </button>
                                </div>

                                {(() => {
                                    const list = comments.filter(c => c.project_id === viewingProject.id).slice().reverse();
                                    if (list.length === 0) {
                                        return <p className="text-xs text-gray-600 text-center py-4">尚無留言，記錄第一筆更新吧</p>;
                                    }
                                    return (
                                        <ul className="space-y-3">
                                            {list.map(c => (
                                                <li key={c.id} className={`rounded-lg p-3 border ${c.kind === 'system' ? 'bg-[#0d1117] border-gray-800' : 'bg-[#21262d]/60 border-gray-700'}`}>
                                                    <div className="flex items-center justify-between mb-1">
                                                        <span className="text-xs font-bold text-gray-300">
                                                            {c.kind === 'system' ? '🔄 系統紀錄' : `💬 ${c.author}`}
                                                        </span>
                                                        <span className="flex items-center gap-2 text-[11px] text-gray-500">
                                                            {formatTime(c.created_at)}
                                                            {canDeleteComment(c) && (
                                                                <button onClick={() => handleDeleteComment(c)} className="text-red-400 hover:text-red-300">刪除</button>
                                                            )}
                                                        </span>
                                                    </div>
                                                    <p className={`text-sm whitespace-pre-wrap ${c.kind === 'system' ? 'text-gray-400' : 'text-gray-200'}`}>
                                                        {c.kind === 'system' && c.author ? `${c.author}：` : ''}{c.content}
                                                    </p>
                                                </li>
                                            ))}
                                        </ul>
                                    );
                                })()}
                            </div>
                        </div>
                        );
                    })()}

                    {/* ===== 專案列表 ===== */}
                    {currentTab === "專案列表" && !viewingProject && (
                        <div className="p-6 max-w-7xl mx-auto">
                            <div className="mb-6">
                                <h1 className="text-2xl font-bold mb-1 text-white">專案列表<span className="text-emerald-400">.</span></h1>
                                <p className="text-gray-400 text-sm">追蹤每個 AI 工具的進度、痛點與實際改善成果（點卡片可查看詳情）</p>
                            </div>

                            {/* 🔍 搜尋 / 篩選列 */}
                            <div className="dark-card rounded-xl p-4 mb-4 space-y-3">
                                <div className="flex flex-wrap items-center gap-3">
                                    <input
                                        type="text"
                                        className="flex-1 min-w-[200px] p-2.5 rounded-lg dark-input text-sm"
                                        placeholder="🔍 搜尋專案名稱、負責人、內容關鍵字..."
                                        value={searchText}
                                        onChange={e => setSearchText(e.target.value)}
                                    />
                                    <select className="p-2.5 rounded-lg dark-input text-sm" value={filterAuthor} onChange={e => setFilterAuthor(e.target.value)}>
                                        <option value="全部">負責人：全部</option>

                                    <div>
                                        <label className="text-xs text-emerald-400 block mb-1">⚡ 優化方法</label>
                                        <textarea rows="2" className="w-full p-2.5 rounded-lg dark-input text-sm" value={newProject.solution} onChange={e => setNewProject({...newProject, solution: e.target.value})} placeholder="例如：利用該網址轉化文字..."></textarea>
                                    </div>
                                    <div>
                                        <label className="text-xs text-yellow-400 block mb-1">📈 目前進展</label>
                                        <textarea rows="2" className="w-full p-2.5 rounded-lg dark-input text-sm" value={newProject.progress} onChange={e => setNewProject({...newProject, progress: e.target.value})} placeholder="例如：已完成核心功能，剩介面調整與測試..."></textarea>
                                    </div>

                                    <div>
                                        <label className="text-xs text-gray-400 block mb-1">專案網址 (URL)</label>
                                        <input type="url" className="w-full p-2.5 rounded-lg dark-input text-sm" value={newProject.link} onChange={e => setNewProject({...newProject, link: e.target.value})} placeholder="https://" />
                                    </div>

                                    <div>
                                        <label className="text-xs text-gray-400 block mb-1">成果附圖（最多 {MAX_IMAGES} 張，可一次多選，點圖上 ✕ 可刪除）</label>
                                        <input
                                            type="file"
                                            accept="image/*"
                                            multiple
                                            onChange={handleImageUpload}
                                            disabled={newProject.images.length >= MAX_IMAGES}
                                            className="w-full p-2 rounded-lg dark-input text-xs text-gray-300 file:mr-3 file:py-1 file:px-3 file:rounded-md file:border-0 file:bg-emerald-500 file:text-black file:font-bold disabled:opacity-40"
                                        />
                                        <p className="text-[11px] text-gray-500 mt-1">已上傳 {newProject.images.length} / {MAX_IMAGES} 張</p>
                                        {newProject.images.length > 0 && (
                                            <div className="mt-2 flex flex-wrap gap-2">
                                                {newProject.images.map((img, idx) => (
                                                    <div key={idx} className="relative group">
                                                        <img src={img} alt={`預覽 ${idx + 1}`} className="h-24 w-24 rounded border border-gray-700 object-cover" />
                                                        <button
                                                            type="button"
                                                            onClick={() => handleRemoveImage(idx)}
                                                            title="刪除這張圖"
                                                            className="absolute -top-2 -right-2 w-6 h-6 rounded-full bg-red-600 hover:bg-red-500 text-white text-xs font-bold flex items-center justify-center shadow-lg"
                                                        >
                                                            ✕
                                                        </button>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>

                                    <div className="flex justify-end gap-2 pt-3">
                                        <button type="button" onClick={handleCloseProjectModal} className="px-4 py-2 text-gray-400 text-sm hover:text-white">取消</button>
                                        <button type="submit" disabled={submitting} className="px-5 py-2 bg-emerald-500 text-black font-bold text-sm rounded-lg hover:bg-emerald-400 disabled:opacity-50">
                                            {submitting ? (editingProjectId ? '更新中...' : '發布中...') : (editingProjectId ? '儲存變更' : '確認發布')}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* 彈窗：新增成員帳號（僅 ADMIN） */}
                    {showUserModal && currentUser.role === "ADMIN" && (
                        <div className="fixed inset-0 bg-black/75 flex items-center justify-center p-4 z-50">
                            <div className="dark-card p-6 rounded-2xl w-full max-w-md shadow-2xl">
                                <h2 className="text-xl font-bold mb-4 text-white">👤 新增成員帳號</h2>
                                <form onSubmit={handleAddUser} className="space-y-3">
                                    <div>
                                        <label className="text-xs text-gray-400 block mb-1">成員暱稱</label>
                                        <input type="text" required className="w-full p-2.5 rounded-lg dark-input text-sm" value={newUser.name} onChange={e => setNewUser({...newUser, name: e.target.value})} placeholder="例如：成員 B" />
                                    </div>
                                    <div>
                                        <label className="text-xs text-gray-400 block mb-1">帳號（英文＋數字組合）</label>
                                        <input
                                            type="text"
                                            required
                                            pattern="^(?=.*[A-Za-z])(?=.*\d)[A-Za-z0-9]+$"
                                            title="帳號需同時包含英文字母與數字"
                                            className="w-full p-2.5 rounded-lg dark-input text-sm"
                                            value={newUser.account}
                                            onChange={e => setNewUser({...newUser, account: e.target.value})}
                                            placeholder="例如：user01"
                                        />
                                        <p className="text-[11px] text-gray-500 mt-1">需同時包含英文字母與數字，例如 user01</p>
                                    </div>
                                    <div>
                                        <label className="text-xs text-gray-400 block mb-1">密碼（6 位數字）</label>
                                        <input
                                            type="password"
                                            required
                                            inputMode="numeric"
                                            pattern="^\d{6}$"
                                            maxLength="6"
                                            title="密碼需為 6 位數字"
                                            className="w-full p-2.5 rounded-lg dark-input text-sm"
                                            value={newUser.password}
                                            onChange={e => setNewUser({...newUser, password: e.target.value.replace(/\D/g, '').slice(0, 6)})}
                                            placeholder="例如：123456"
                                        />
                                        <p className="text-[11px] text-gray-500 mt-1">固定 6 位數字，例如 123456</p>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="text-xs text-gray-400 block mb-1">單位（含班別）</label>
                                            <select className="w-full p-2.5 rounded-lg dark-input text-sm" value={newUser.unit} onChange={e => setNewUser({...newUser, unit: e.target.value})}>
                                                {UNIT_OPTIONS.map(opt => (
                                                    <option key={opt} value={opt}>{opt}</option>
                                                ))}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-xs text-gray-400 block mb-1">權限角色</label>
                                            <select className="w-full p-2.5 rounded-lg dark-input text-sm" value={newUser.role} onChange={e => setNewUser({...newUser, role: e.target.value})}>
                                                <option value="ADMIN">ADMIN</option>
                                                <option value="MEMBER">MEMBER</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div className="flex justify-end gap-2 pt-3">
                                        <button type="button" onClick={() => setShowUserModal(false)} className="px-4 py-2 text-gray-400 text-sm hover:text-white">取消</button>
                                        <button type="submit" className="px-5 py-2 bg-emerald-500 text-black font-bold text-sm rounded-lg hover:bg-emerald-400">確認新增</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
